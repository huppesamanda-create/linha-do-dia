  <script>
window.ENAM_DATA = {"exam":{"title":"ENAM 2026.2","date":"2026-11-29","questions":80,"durationMinutes":300},"syllabus":[{"id":"constitucional","title":"Direito Constitucional","area":"Direito Constitucional","items":[{"id":"constitucional-01","number":1,"label":"Teoria da Constituição e do Direito Constitucional","full":"Teoria da Constituição e do Direito Constitucional. Conceito e características. A Constituição em perspectiva histórico-evolutiva. Constitucionalismo contemporâneo. Antecedentes. Neoconstitucionalismo. Estado Constitucional contemporâneo. Poder constituinte e mudança (reforma e mutação) constitucional. Emendas à Constituição."},{"id":"constitucional-02","number":2,"label":"Estrutura, conteúdo e função das constituições","full":"Estrutura, conteúdo e função das constituições. O preâmbulo das constituições e sua força jurídica na Constituição Federal de 1988. Disposições constitucionais permanentes e transitórias."},{"id":"constitucional-03","number":3,"label":"Teoria da norma constitucional no direito constitucional brasileiro vigente","full":"Teoria da norma constitucional no direito constitucional brasileiro vigente. Eficácia e aplicabilidade das normas constitucionais A norma constitucional no “tempo”. Relações entre a Constituição e a ordem jurídica anterior. Aplicação das normas constitucionais no espaço: as relações com o direito estrangeiro e internacional."},{"id":"constitucional-04","number":4,"label":"Interpretação constitucional","full":"Interpretação constitucional. Princípios da interpretação constitucional. Princípio da unidade da Constituição. O princípio da “concordância prática” ou da “harmonização”. A chamada “ponderação” no campo da interpretação constitucional. Proporcionalidade e razoabilidade como princípios e critérios de interpretação constitucional. O princípio da supremacia da Constituição. O princípio da máxima eficácia e efetividade da Constituição. O princípio da força normativa da Constituição. Princípio da interpretação das leis conforme a Constituição. Divisão e separação de Poderes."},{"id":"constitucional-05","number":5,"label":"Princípios fundamentais","full":"Princípios fundamentais. Função, classificação e eficácia dos princípios constitucionais fundamentais. Princípio da dignidade da pessoa humana. O princípio democrático e a soberania popular. O princípio do pluralismo político. O princípio do Estado de Direito e seus subprincípios. O princípio republicano. O princípio federativo. O princípio da sustentabilidade."},{"id":"constitucional-06","number":6,"label":"Teoria geral dos direitos fundamentais","full":"Teoria geral dos direitos fundamentais. Direitos humanos e direitos fundamentais: distinções e aproximações. Cláusula de abertura (expansividade) do catálogo constitucional dos direitos fundamentais. Titularidade dos direitos e garantias fundamentais. A dupla dimensão objetiva e subjetiva dos direitos e garantias fundamentais. Eficácia dos direitos fundamentais nas relações privadas. Limites e restrições de direitos fundamentais. Direitos civis e políticos."},{"id":"constitucional-07","number":7,"label":"Acesso à justiça","full":"Acesso à justiça. Devido processo legal. Contraditório e ampla defesa. Isonomia. Princípios e garantias fundamentais dos processos civil, penal e administrativo. Direito e restrições à prova. Prova ilícita e ilegítima. Contaminação de vícios. Encontro fortuito de provas. Interceptação telefônica e de dados. Prova emprestada. Aproveitamento da prova ilícita e proporcionalidade. Presunção de inocência, prisão em flagrante, temporária e preventiva. Flagrante esperado, preparado e diferido. Liberdade provisórias. Medidas Cautelares."},{"id":"constitucional-08","number":8,"label":"Direitos fundamentais sociais","full":"Direitos fundamentais sociais. O “princípio da proibição de retrocesso”. A garantia do mínimo existencial. Direito à saúde, assistência e previdência sociais. Direito à alimentação, moradia, educação e lazer. O direito ao trabalho. O direito ao meio ambiente saudável e equilibrado. O direito à proteção da infância e da juventude, da maternidade e do idoso. O direito à cultura e ao patrimônio histórico-cultural. O direito à proteção dos povos originários, das pessoas negras e das pessoas com deficiência."},{"id":"constitucional-09","number":9,"label":"Organização do Estado e da repartição de competências","full":"Organização do Estado e da repartição de competências. O Estado Federal na Constituição de 1988 e sua estruturação (União, Estados-Membros, Distrito Federal e Territórios). Federalismo. Intervenção Federal. Repartição de competências administrativas (materiais) dos entes federativos. Aspectos gerais, competências comuns e exclusivas (indelegáveis). Competências legislativas da União, dos Estados, do Distrito Federal e dos Municípios, comuns, concorrentes e suplementares. Competências legislativas privativas da União e sua delegação."},{"id":"constitucional-10","number":10,"label":"Poder Legislativo","full":"Poder Legislativo. Congresso Nacional: estrutura, organização, atribuições e competências. Câmara dos Deputados e Senado Federal. Processo Legislativo. Iniciativa das leis. Fiscalização Contábil, Financeira e Orçamentária. Tribunal de Contas da União: natureza e atribuições. Cláusulas pétreas. Natureza. Espécies."},{"id":"constitucional-11","number":11,"label":"Poder Executivo","full":"Poder Executivo. Presidente e Vice-Presidente da República: atribuições e responsabilidades. Ministros de Estado. Conselho da República e do Conselho de Defesa Nacional. Administração Pública. Princípios gerais. Militares dos Estados, do Distrito Federal e dos Territórios. Poder regulamentar. Agências reguladoras."},{"id":"constitucional-12","number":12,"label":"Poder Judiciário","full":"Poder Judiciário. Competências e atribuições: Supremo Tribunal Federal, Superior Tribunal de Justiça, Tribunal Superior do Trabalho, Tribunal Superior Eleitoral, Superior Tribunal Militar. Tribunais Regionais Federais e Juízes Federais, Tribunais Regionais do Trabalho e Juízes do Trabalho, Tribunais Regionais Eleitorais e Juízes Eleitorais, Tribunais e Juízes Militares, Tribunais de Justiça e Juízes dos Estados, do Distrito Federal e Territórios. Juizados Especiais. Garantias e prerrogativas dos magistrados. O Estatuto da Magistratura. Estrutura e formação dos tribunais. Quinto constitucional. Conselho Nacional de Justiça. Autonomia administrativa e financeira do Poder Judiciário. Funções Essenciais à Justiça. Ministério Público. Defensoria Pública. Advocacia Pública e Privada."},{"id":"constitucional-13","number":13,"label":"Defesa do Estado e das Instituições Democráticas","full":"Defesa do Estado e das Instituições Democráticas. Estado de Defesa e Estado de Sítio. Forças Armadas. Segurança Pública."},{"id":"constitucional-14","number":14,"label":"Princípios do direito tributário e da ordem econômica","full":"Princípios do direito tributário e da ordem econômica. Sistema tributário nacional. Tributos em espécie: noções gerais. Competência tributária: classificação, exercício da competência tributária. Capacidade tributária. Limitações constitucionais ao Poder de Tributar. Imunidade tributária, isenção e não incidência. Orçamento e finanças públicas. Repartição de receitas públicas."},{"id":"constitucional-15","number":15,"label":"Controle de constitucionalidade (formas e tipos)","full":"Controle de constitucionalidade (formas e tipos). Controle concentrado de constitucionalidade: ação direta de constitucionalidade, ação declaratória de constitucionalidade, ação direta de inconstitucionalidade por omissão, arguição de descumprimento de preceito fundamental. Controle difuso e incidental de constitucionalidade. Efeitos das decisões de inconstitucionalidade e de constitucionalidade. Modulação temporal de efeitos. Técnicas de decisão no controle de constitucionalidade. Controle de constitucionalidade dos direitos estadual e municipal."}]},{"id":"administrativo","title":"Direito Administrativo","area":"Direito Administrativo","items":[{"id":"administrativo-01","number":1,"label":"Administração Pública e Constituição","full":"Administração Pública e Constituição. Atividade administrativa e direitos fundamentais. Princípios constitucionais da atividade administrativa. Inovações da Lei n. 13.655/2018 quanto à LINDB. O método pragmático de aplicação do direito administrativo."},{"id":"administrativo-02","number":2,"label":"Funções Públicas","full":"Funções Públicas. Função administrativa e demais funções do Estado. As características da função administrativa. Reserva de Administração."},{"id":"administrativo-03","number":3,"label":"Legalidade administrativa e autonomia da Administração Pública","full":"Legalidade administrativa e autonomia da Administração Pública. Conceituação de legalidade administrativa. Competência administrativa. Competências vinculadas e competências discricionárias. Consensualidade no exercício das competências administrativas."},{"id":"administrativo-04","number":4,"label":"A estrutura organizacional da Administração Pública","full":"A estrutura organizacional da Administração Pública. Pessoas jurídicas e órgãos. Órgãos públicos. Desconcentração e descentralização. Administração direta e administração indireta. Administração indireta e sua composição. Autarquias. Empresas estatais e suas espécies."},{"id":"administrativo-05","number":5,"label":"Ato Administrativo","full":"Ato Administrativo. Conceito e regime jurídico. Elementos e requisitos. Vícios dos atos administrativos. Abuso e desvio de poder. Principais classificações dos atos administrativos."},{"id":"administrativo-06","number":6,"label":"Regulamento administrativo","full":"Regulamento administrativo. Conceito e regime jurídico. Limites da competência regulamentar. Espécies. A questão do regulamento autônomo."},{"id":"administrativo-07","number":7,"label":"Processo Administrativo","full":"Processo Administrativo. Garantia constitucional. Processo administrativo e procedimento. Finalidades do processo administrativo. Lei Geral de Processo Administrativo. Regras e princípios fundamentais."},{"id":"administrativo-08","number":8,"label":"Licitação pública","full":"Licitação pública. Disciplina constitucional. Normas gerais sobre licitação. Princípios e regras fundamentais. Lei de licitações e contratos administrativos. Contratação direta."},{"id":"administrativo-09","number":9,"label":"Contratos Administrativos","full":"Contratos Administrativos. Conceituação. Modalidades. Regime jurídico fundamental. A alocação dos riscos no contrato administrativo. As competências anômalas da Administração Pública. A modificação do contrato administrativo. A extinção do contrato administrativo. As garantias ao particular contratado."},{"id":"administrativo-10","number":10,"label":"Poder de Polícia","full":"Poder de Polícia. Conceito e identificação. Características fundamentais. Espécies. Delegação e seus limites. Sanções administrativas."},{"id":"administrativo-11","number":11,"label":"Poder de polícia e direitos reais","full":"Poder de polícia e direitos reais. A função social da propriedade. Limitações administrativas à propriedade. Desapropriação e suas espécies. Requisitos para a desapropriação. Desapropriação indireta. Desapropriação amigável e desapropriação judicial. Decreto-lei n. 3.365/1941."},{"id":"administrativo-12","number":12,"label":"Serviço Público","full":"Serviço Público. Conceito e identificação. Serviços públicos e atividade econômica. Características fundamentais. Classificação e espécies. Serviço público adequado. Lei de defesa do usuário do serviço público (Lei n. 13.460/2017)."},{"id":"administrativo-13","number":13,"label":"Delegação do serviço público","full":"Delegação do serviço público. Concessão e permissão de serviço público. Conceito e características básicas da concessão de serviço público. Concessão comum, concessão patrocinada e concessão administrativa. Contrato de concessão de serviço público. Remuneração do serviço público concedido. Competências do poder concedente. Direitos do concessionário. Garantias ao usuário. Regime jurídico dos bens necessários e úteis à concessão. Intervenção do poder concedente no concessionário. Extinção da concessão e suas modalidades."},{"id":"administrativo-14","number":14,"label":"Exploração de atividade econômica pelo Estado","full":"Exploração de atividade econômica pelo Estado. Conceito e características. Disciplina constitucional. Hipóteses de cabimento. A distinção entre exploração de atividade econômica e prestação de serviço público. A Lei n. 13.303/2016."},{"id":"administrativo-15","number":15,"label":"Regulação econômico-social","full":"Regulação econômico-social. Conceito e identificação. O modelo de Estado-Regulador. As agências reguladoras: conceituação e características fundamentais. A competência normativa das agências reguladoras. A Lei das Agências Reguladoras Federais (Lei Federal n. 13.848/2019). A Lei Geral de Proteção de Dados (Lei n. 13.709/2018). Limites da intervenção estatal na liberdade econômica (Lei n. 13.874/2019)."},{"id":"administrativo-16","number":16,"label":"Agentes públicos","full":"Agentes públicos. Agente público: a teoria do órgão. Disciplina constitucional. Espécies. Agentes políticos: identificação. Militares: identificação. Servidores públicos: identificação. Empregados públicos: identificação. Agentes contratados por tempo determinado. Normas constitucionais comuns a todas as espécies de agentes. Cargos públicos e modalidades de provimento. Concurso público de provimento de cargo público. Princípios e regras constitucionais quanto ao concurso público. Regime disciplinar: princípios e regras constitucionais. Responsabilidade civil, criminal e administrativa do agente público. Aspectos constitucionais do regime de previdência do servidor público."},{"id":"administrativo-17","number":17,"label":"Bens públicos","full":"Bens públicos. Regime jurídico dos bens públicos. Classificação dos bens públicos no Código Civil. Bens de titularidade dos povos originários e comunidades tradicionais e sua identificação. Fruição exclusiva de bens públicos imóveis por particulares. A concessão de bens públicos e suas modalidades. Terras devolutas e seu regime jurídico. Terrenos de marinha e seu regime jurídico."},{"id":"administrativo-18","number":18,"label":"Controle da atividade administrativa","full":"Controle da atividade administrativa. Conceituação e espécies. Controle interno e suas características. Controle externo pelos tribunais de contas. A disciplina dos arts. 70 e 71 da Constituição Federal. Competências privativas do tribunal de contas. A natureza dos atos de controle dos tribunais de contas. Controle externo pelo Poder Judiciário. Controle pelo Poder Judiciário e a separação de poderes. Limites do controle jurisdicional de atos administrativos."},{"id":"administrativo-19","number":19,"label":"Mandado de segurança e seu regime constitucional","full":"Mandado de segurança e seu regime constitucional. Mandado de segurança individual e coletivo. Requisitos do mandado de segurança. Mandado de segurança e provimentos cautelares. Efeitos da concessão e da denegação do mandado de segurança. Ação popular e seu regime constitucional. Requisitos da ação popular. Efeitos da concessão e da denegação da ação popular. Ação civil pública e seu regime constitucional. A legitimação ativa para a ação civil pública. As hipóteses de cabimento da ação civil pública. O sancionamento por improbidade administrativa. Conceituação e hipóteses legais da improbidade administrativa. As alterações da Lei n. 14.230/2021 quanto às hipóteses de improbidade administrativa. A ação de improbidade administrativa introduzida pela Lei n. 14.230/2021. A prescrição da pretensão relativa à improbidade administrativa. A prescrição intercorrente. Prazos e regimes."},{"id":"administrativo-20","number":20,"label":"Responsabilidade civil do Estado","full":"Responsabilidade civil do Estado. Regime constitucional da responsabilidade civil do Estado. A questão da responsabilidade objetiva e seus limites. Causas excludentes e atenuantes. A responsabilidade civil do Estado por atos legislativos e jurisdicionais, inclusive por erro judiciário. A reparação do dano e sua abrangência."},{"id":"administrativo-21","number":21,"label":"Decadência e prescrição nas relações administrativas","full":"Decadência e prescrição nas relações administrativas. As hipóteses de decadência de direitos da Administração Pública. As hipóteses de prescrição das pretensões da Administração Pública. As competências dos tribunais de contas e a extinção de poderes pelo decurso do tempo. A extinção de direitos e pretensões dos particulares pelo decurso do tempo."}]},{"id":"humanistica","title":"Noções Gerais de Direito e Formação Humanística","area":"Formação Humanística","items":[{"id":"humanistica-01","number":1,"label":"Sociologia do Direito","full":"Sociologia do Direito. Noções gerais. Introdução à sociologia da administração judiciária. Aspectos gerenciais da atividade. Relações sociais e relações jurídicas. Controle Social e o Direito. Transformações sociais e Direito. Direito, Comunicação Social e opinião pública. Conflitos sociais e mecanismos de resolução. Sistemas não-judiciais de composição de litígios."},{"id":"humanistica-02","number":2,"label":"Psicologia Judiciária","full":"Psicologia Judiciária. Noções gerais. Psicologia e Comunicação: relacionamento interpessoal, relacionamento do magistrado com a sociedade e a mídia. Gestão de Pessoas. Assédio moral e assédio sexual. Teoria do conflito e os mecanismos autocompositivos. Técnicas de negociação e mediação. Procedimentos, posturas, condutas e mecanismos aptos a obter a solução conciliada dos conflitos. O processo psicológico e a obtenção da verdade judicial. O comportamento de partes e testemunhas."},{"id":"humanistica-03","number":3,"label":"Ética e estatuto jurídico da magistratura nacional","full":"Ética e estatuto jurídico da magistratura nacional. Regime jurídico da magistratura nacional: carreiras, ingresso, promoções, remoções. Direitos e deveres funcionais da magistratura. Código de Ética da Magistratura Nacional. Sistemas de controle interno do Poder Judiciário: Corregedorias, Ouvidorias, Conselhos Superiores e Conselho Nacional de Justiça. Responsabilidade administrativa, civil e criminal dos magistrados. Princípios de Bangalore sobre Código Ibero-americano de Ética judicial. Administração Judicial. Planejamento estratégico. Modernização da gestão."},{"id":"humanistica-04","number":4,"label":"Filosofia do Direito","full":"Filosofia do Direito. Noções gerais. O conceito de Justiça. Sentido lato de Justiça, como valor universal. Sentido estrito de Justiça, como valor jurídico-político. Divergências sobre o conteúdo do conceito. O conceito de Direito. Equidade. Direito e Moral. A interpretação do Direito. A superação dos métodos de interpretação mediante puro raciocínio lógico dedutivo. O método de interpretação pela lógica do razoável."},{"id":"humanistica-05","number":5,"label":"Teoria Geral do Direito","full":"Teoria Geral do Direito. Noções gerais. Norma jurídica (conceito, natureza, espécies). Direito objetivo e direito subjetivo. Fontes do Direito. Princípios e regras jurídicas. Jurisprudência e Precedentes judiciais como fonte do Direito. Súmula Vinculante. Eficácia da lei no tempo. Conflito de normas jurídicas no tempo e o Direito Brasileiro: Direito Penal, Direito Civil, Direito Constitucional e Direito do Trabalho. Teoria Política: noções gerais. Relações entre a Política e o Direito. Gênero e Patriarcado. Gênero e Raça. Discriminação e Desigualdades de Gênero – questões centrais. Protocolo de julgamento com perspectiva de gênero."},{"id":"humanistica-06","number":6,"label":"Relações entre direito estrangeiro e a ordem jurídica interna","full":"Relações entre direito estrangeiro e a ordem jurídica interna. A Declaração Universal dos Direitos do Homem (ONU). Tratados Internacionais sobre Direitos Humanos da ONU, da OEA e da OIT. Controle Jurisdicional de Convencionalidade. Agenda 2030: os dos 17 Objetivos do desenvolvimento sustentável e aplicação para o Poder Judiciário."},{"id":"humanistica-07","number":7,"label":"Direito Digital","full":"Direito Digital. 4ª Revolução industrial. Tecnologia no contexto jurídico. Automação do processo. Inteligência Artificial e Direito. Audiências virtuais. Cortes remotas. Ciência de dados e Jurimetria. Resoluções do CNJ sobre inovações tecnológicas no Judiciário. Persecução Penal e novas tecnologias. Crimes virtuais e cibersegurança. Deepweb e Darkweb. Provas digitais. Criptomoedas e Lavagem de dinheiro. Noções gerais de contratos Inteligentes, Blockchain e Algoritmos. LGPD e proteção de dados pessoais."},{"id":"humanistica-08","number":8,"label":"Cognição do juiz e tomada de decisão","full":"Cognição do juiz e tomada de decisão. Pragmatismo, consequencialismo, contextualismo, racionalismo e empirismo. Dialética. Utilitarismo: similaridades e distinções. Disposições da LINDB sobre o consequencialismo na tomada de decisão judicial. Introdução à análise econômica do direito. Conceitos fundamentais. Racionalidade econômica. Eficiência processual. Métodos adequados de resolução de conflitos e acesso à Justiça. Demandas frívolas e de valor esperado negativo. Precedentes, estabilidade da jurisprudência e segurança jurídica. Coisa Julgada. Economia comportamental. Heurística e vieses cognitivos. A percepção de Justiça. Processo cognitivo de tomada de decisão. Governança corporativa e Compliance no Brasil. Mecanismos de Combate às organizações criminosas e Lavagem de Dinheiro. Whistleblower."},{"id":"humanistica-09","number":9,"label":"Direito da antidiscriminação","full":"Direito da antidiscriminação. Legislação antidiscriminação nacional e internacional. Modalidades de discriminação. Conceitos fundamentais do racismo, sexismo, intolerância religiosa, LGBTQIA+fobia (Resoluções CNJ). Discriminação e desigualdades de gênero: questões centrais. Gênero e patriarcado. Gênero e raça. Protocolo de julgamento com perspectiva de gênero. Ações Afirmativas. Direitos dos povos originários e das comunidades tradicionais. Normas internacionais de proteção da criança e do adolescente. Normas internacionais de proteção à mulher, aos idosos, e às pessoas com deficiência."}]},{"id":"direitos-humanos","title":"Direitos Humanos","area":"Direitos Humanos","items":[{"id":"direitos-humanos-01","number":1,"label":"Teoria Geral dos Direitos Humanos","full":"Teoria Geral dos Direitos Humanos. Direitos Humanos nas empresas."},{"id":"direitos-humanos-02","number":2,"label":"Sistema global de proteção dos direitos humanos","full":"Sistema global de proteção dos direitos humanos."},{"id":"direitos-humanos-03","number":3,"label":"Sistema regional interamericano de proteção dos direitos humanos","full":"Sistema regional interamericano de proteção dos direitos humanos"},{"id":"direitos-humanos-04","number":4,"label":"Controle de convencionalidade","full":"Controle de convencionalidade."},{"id":"direitos-humanos-05","number":5,"label":"A relação entre o direito internacional dos direitos humanos e o direito brasileiro","full":"A relação entre o direito internacional dos direitos humanos e o direito brasileiro."},{"id":"direitos-humanos-06","number":6,"label":"Os direitos humanos na Constituição Federal de 1988","full":"Os direitos humanos na Constituição Federal de 1988."},{"id":"direitos-humanos-07","number":7,"label":"A jurisprudência do Supremo Tribunal Federal em matéria de direitos humanos","full":"A jurisprudência do Supremo Tribunal Federal em matéria de direitos humanos."},{"id":"direitos-humanos-08","number":8,"label":"Os princípios que regem as relações internacionais do Brasil","full":"Os princípios que regem as relações internacionais do Brasil. Os direitos consagrados nos tratados internacionais de direitos humanos dos quais o Brasil for parte. O procedimento de incorporação dos tratados de direitos humanos na perspectiva da Constituição. Hierarquia dos tratados de direitos fundamentais na ordem jurídica interna brasileira. Controle judicial de convencionalidade (interno e externo)."},{"id":"direitos-humanos-09","number":9,"label":"Direitos dos Povos Originários","full":"Direitos dos Povos Originários. Declaração das Nações Unidas sobre os direitos dos povos indígenas. Convenção 169 da Organização Internacional do Trabalho. Convenção sobre os Povos Indígenas e Tribais. Convenção Americana sobre Direitos Humanos. Resoluções do Conselho Nacional de Justiça sobre direitos e garantias dos povos originários."}]},{"id":"processo-civil","title":"Direito Processual Civil","area":"Processo Civil","items":[{"id":"processo-civil-01","number":1,"label":"Normas fundamentais do processo civil (constitucionais e infraconstitucionais)","full":"Normas fundamentais do processo civil (constitucionais e infraconstitucionais). Constitucionalização do Direito Processual. Acesso à justiça. Fontes da norma processual (atos legislativos, costume, precedentes, resoluções, negócios jurídicos processuais). Norma processual no tempo e no espaço."},{"id":"processo-civil-02","number":2,"label":"Jurisdição","full":"Jurisdição. Conceito. Natureza. Caraterísticas. Espécies. Distinção em relação às demais funções do Estado. Jurisdição contenciosa e voluntária. Jurisdição estatal e arbitral. Poderes e funções jurisdicionais do juiz e do árbitro. Imparcialidade, impedimento e suspeição."},{"id":"processo-civil-03","number":3,"label":"Competência","full":"Competência. Critérios de determinação. Identificação de foro competente. Perpetuatio jurisdictionis. Conflitos de competência positivos, negativos e sobre a reunião ou separação de processos. Transferência e modificação de competências (conexão, continência, prevenção). Reunião de processos independentemente de conexão. Coordenação de competências. Cooperação judiciária nacional: conceito, instrumentos e procedimentos. Cooperação interinstitucional. Cooperação do Poder Judiciário com os árbitros. Cooperação jurídica internacional."},{"id":"processo-civil-04","number":4,"label":"Ação e tutela jurisdicional dos direitos","full":"Ação e tutela jurisdicional dos direitos. Legitimidade e interesse processual. Pressupostos processuais e seu controle pelo juiz. Boa-fé e cooperação processuais. Abuso do direito de litigar. Litigância de má-fé."},{"id":"processo-civil-05","number":5,"label":"Participação dos sujeitos do processo","full":"Participação dos sujeitos do processo. O juiz, sua atuação e poderes, impedimento e suspeição. Partes e terceiros no processo civil. Mecanismos de proteção aos litigantes vulneráveis. Litisconsórcio: conceito, espécies e regime. Litisconsórcio necessário e unitário. Modalidades de intervenção de terceiros típicas e atípicas. Assistência simples e litisconsorcial, denunciação à lide, chamamento ao processo. Incidente de desconsideração da personalidade jurídica. Amicus curiae. Ministério Público, sua atuação como parte e fiscal da ordem jurídica. Defensoria Pública. Advocacia pública e privada. Deveres das partes, seus procuradores e demais partícipes do processo; substituição e sucessão de partes e procuradores. Representação técnica."},{"id":"processo-civil-06","number":6,"label":"Atos processuais: forma, tempo e lugar","full":"Atos processuais: forma, tempo e lugar. Prazos. Comunicação dos atos processuais. Invalidades processuais. Aproveitamento dos atos processuais defeituosos. Convenção das partes em matéria processual (típicas e atípicas). Limites do controle judicial à negociação sobre o processo. Tecnologia e sistema de justiça. Processo eletrônico. Juízo 100% digital. Audiências remotas e híbridas. Resoluções do CNJ sobre o emprego da tecnologia no Judiciário."},{"id":"processo-civil-07","number":7,"label":"Petição inicial","full":"Petição inicial. Requisitos e controle de admissibilidade. Pedido. Pedido (alteração, aditamento e cumulação); pedidos alternativo, sucessivo e subsidiário. Interpretação dos atos postulatórios. Audiência de conciliação ou mediação. Resposta do réu (contestação, reconvenção, exceções). Providências preliminares e julgamento conforme o estado do processo. Saneamento e organização do processo. Eficiência processual. Gestão do procedimento pelo juiz."},{"id":"processo-civil-08","number":8,"label":"Fase instrutória: conceito e características","full":"Fase instrutória: conceito e características. Provas: objeto, fonte e meios. Provas atípicas e convencionadas. Normas fundamentais do Direito probatório. Proibição de prova ilícita. Ônus da prova. Estândares probatórios. Provas em espécie e sua produção. Produção antecipada de prova. Audiência de instrução e julgamento."},{"id":"processo-civil-09","number":9,"label":"Atos não decisórios do juiz","full":"Atos não decisórios do juiz. Despachos. Fase decisória. Decisões judiciais: características e espécies. Sentença, natureza e conceito, classificação, requisitos, funções, vícios, efeitos. Atipicidade das formas de tutela jurisdicional. Fundamentação adequada das decisões. Interpretação das decisões judiciais."},{"id":"processo-civil-10","number":10,"label":"Tutela provisória: conceito, função, espécies","full":"Tutela provisória: conceito, função, espécies. Tutela cautelar e satisfativa (antecipada). Tutela de urgência e tutela de evidência: requisitos. Tutela provisória antecedente e incidente."},{"id":"processo-civil-11","number":11,"label":"Coisa julgada: natureza, conceito, classificação, limites objetivos e subjetivos","full":"Coisa julgada: natureza, conceito, classificação, limites objetivos e subjetivos. Coisa julgada formal e material. Limites subjetivos, objetivos e temporais. Coisa julgada e resolução de questão prejudicial incidental. Eficácia preclusiva da coisa julgada. Preclusão: conceito e espécies. Estabilização da tutela provisória antecedente."},{"id":"processo-civil-12","number":12,"label":"Precedentes judiciais: conceito e efeitos para o juízo","full":"Precedentes judiciais: conceito e efeitos para o juízo. Técnicas e métodos na formação e superação de precedentes. Regras de transição. Jurisprudência e súmulas."},{"id":"processo-civil-13","number":13,"label":"Recursos","full":"Recursos. Natureza, conceito, inserção entre os mecanismos de impugnação das decisões judiciais, classificação. Pressupostos de admissibilidade. Mérito recursal. Efeitos da interposição e do julgamento dos recursos. Remessa necessária. Sucedâneos recursais; remessa obrigatória."},{"id":"processo-civil-14","number":14,"label":"Recursos em espécie (apelação, agravo de instrumento, embargos de declaração, agravo interno, recurso ordinário constitucional, recurso extraordinário, recurso especial)","full":"Recursos em espécie (apelação, agravo de instrumento, embargos de declaração, agravo interno, recurso ordinário constitucional, recurso extraordinário, recurso especial). Prazos e procedimentos recursais, pressupostos específicos, modos de interposição, peculiaridades específicas. Ordem dos processos nos tribunais. Julgamento estendido em caso de divergência."},{"id":"processo-civil-15","number":15,"label":"Ações autônomas de impugnação","full":"Ações autônomas de impugnação. Ação rescisória. Reclamação. Incidente de resolução de demandas repetitivas. Julgamento de recursos repetitivos nos tribunais superiores. Incidente de assunção de competência. Incidente de arguição de inconstitucionalidade em tribunal."},{"id":"processo-civil-16","number":16,"label":"Cumprimento de sentença","full":"Cumprimento de sentença. Pressupostos. Título executivo: espécies e requisitos. Liquidação de sentença. Cumprimento de sentença para pagamento de quantia certa. Cumprimento de sentença na obrigação de fazer, não fazer e entregar coisa. Cumprimento de sentença na obrigação de alimentos."},{"id":"processo-civil-17","number":17,"label":"Execução de títulos extrajudiciais","full":"Execução de títulos extrajudiciais. Execução por quantia certa contra devedor solvente. Execução de obrigação de fazer, não-fazer e entrega de coisa. Execução fiscal. Execução contra a Fazenda Pública."},{"id":"processo-civil-18","number":18,"label":"Débito e responsabilidade patrimonial","full":"Débito e responsabilidade patrimonial. Fraude à execução. Aspectos procedimentais. Suspensão e extinção do cumprimento de sentença e da execução. Concurso de credores. Defesa do executado. Impugnação ao cumprimento de sentença. Ações autônomas de impugnação à execução."},{"id":"processo-civil-19","number":19,"label":"Procedimentos especiais e sua relação com o procedimento comum","full":"Procedimentos especiais e sua relação com o procedimento comum. O trânsito de técnicas processuais entre procedimentos. Procedimentos especiais de jurisdição contenciosa e voluntária: noções gerais. Tipos codificados e não-codificados."},{"id":"processo-civil-20","number":20,"label":"O Poder Público em juízo","full":"O Poder Público em juízo. Mandado de segurança. Ação Popular. Habeas data. Ação de improbidade administrativa. Suspensão de segurança."},{"id":"processo-civil-21","number":21,"label":"Juizados especiais cíveis e Juizados Especiais da Fazenda Pública","full":"Juizados especiais cíveis e Juizados Especiais da Fazenda Pública. Juizados Especiais Federais. Caracterização como subsistema processual e seu relacionamento com o procedimento comum. Estrutura orgânica (juizados, turmas recursais, turmas de uniformização regionais, e turmas e sessões dos tribunais regionais federais). Princípios, características, espécies, competência. Procedimentos, recursos, pedido de uniformização, coisa julgada, cumprimento de sentença."},{"id":"processo-civil-22","number":22,"label":"Tutela dos interesses transindividuais","full":"Tutela dos interesses transindividuais. Ações coletivas para a proteção de direitos e interesses difusos, coletivos e individuais homogêneos. Legitimidade e competência nas ações coletivas. Efeitos das sentenças coletivas e coisa julgada. Processos estruturais. Autocomposição na tutela dos interesses transindividuais: termo de ajustamento de conduta e outros tipos negociais. Cumprimento de sentença coletiva e execução em tutela coletiva. Fundos e outras infraestruturas para efetivação de decisões e acordos."},{"id":"processo-civil-23","number":23,"label":"Custos do processo","full":"Custos do processo. Custas processuais: taxas judiciárias. Despesas processuais. Honorários de advogado. Assistência judiciária."},{"id":"processo-civil-24","number":24,"label":"Meios adequados e integrados de solução de conflitos: o sistema de justiça multiportas","full":"Meios adequados e integrados de solução de conflitos: o sistema de justiça multiportas. Consensualidade e autocomposição. Conciliação, mediação e outros meios de resolução (judicial e extrajudicial) de disputas."},{"id":"processo-civil-25","number":25,"label":"Arbitragem e Poder Judiciário","full":"Arbitragem e Poder Judiciário. Compromisso arbitral e cláusula compromissória. Tutelas de urgência antes, durante e depois do processo arbitral. Impugnação judicial da sentença arbitral. Ação para obtenção do compromisso arbitral. Impedimento e substituição do arbitro. Devido processo arbitral. Cooperação do Poder Judiciário com a arbitragem."}]},{"id":"civil","title":"Direito Civil","area":"Direito Civil","items":[{"id":"civil-01","number":1,"label":"Lei de Introdução às Normas do Direito Brasileiro","full":"Lei de Introdução às Normas do Direito Brasileiro. Vigência, aplicação, interpretação e integração das leis. Constitucionalização do Direito Civil. Conceito. Efeitos. Personalização. Direitos fundamentais e relações privadas. Conflito das leis no tempo. Eficácia da lei no espaço."},{"id":"civil-02","number":2,"label":"Pessoas naturais","full":"Pessoas naturais. Direitos da personalidade. Incapacidade. Legitimidade. Morte presumida. Ausência. Tutela. Curatela. Tomada de decisão apoiada. Estatuto da pessoa com deficiência. Domicílio."},{"id":"civil-03","number":3,"label":"Pessoas jurídicas","full":"Pessoas jurídicas. Personalidade jurídica da pessoa jurídica. Desconsideração. Classificação. Início e fim da personalidade jurídica da pessoa jurídica. Administração. Classificação: pessoas jurídicas de direito público e privado. Sociedades, associações e fundações. Partidos políticos (aspectos civis). Entidades sem personificação jurídica e novos sujeitos de direito. Princípios Orientadores das Nações Unidas sobre Empresas e Direitos Humanos."},{"id":"civil-04","number":4,"label":"Bens","full":"Bens. Classificação. Regime jurídico. Bem de família. Patrimônio. Patrimônio de afetação."},{"id":"civil-05","number":5,"label":"Fatos jurídicos","full":"Fatos jurídicos. Atos jurídicos. Negócios jurídicos. Existência, eficácia e validade. Condição, termo e encargo. Representação. Defeitos do negócio jurídico. Erro ou ignorância, dolo, coação, estado de perigo, lesão, fraude contra credores. Invalidade do negócio jurídico. Nulidade. Simulação. Distinções entre nulidade e anulabilidade. Conversão do negócio jurídico. Ato lícito e ilícito. Abuso do direito. Teoria da aparência. Prescrição e decadência. Prova."},{"id":"civil-06","number":6,"label":"Obrigações","full":"Obrigações. Modalidade das obrigações. Obrigação natural. Obrigação propter rem. Obrigações alternativas. Obrigações divisíveis e indivisíveis. Obrigações solidárias. Transmissão das obrigações: cessão de crédito e assunção de dívida. Adimplemento e extinção das obrigações. Inadimplemento das obrigações. Mora, perdas e danos, juros legais, cláusula penal, arras ou sinal. Preferências e privilégios creditórios."},{"id":"civil-07","number":7,"label":"Contratos em geral: teoria geral dos contratos","full":"Contratos em geral: teoria geral dos contratos. Formação e interpretação. Elementos constitutivos. Pressupostos de validade. Princípios. Função social do contrato. Boa fé subjetiva e objetiva. Revisão e suas modalidades. Extinção."},{"id":"civil-08","number":8,"label":"Contratos em espécie","full":"Contratos em espécie. Compra e venda. Troca ou permuta. Contrato Estimatório. Doação. Locação de coisas. Locação de imóveis. Empréstimo: comodato e mútuo. Prestação de serviço. Empreitada. Depósito. Mandato. Comissão. Agência e distribuição. Corretagem. Transporte. Seguro. Constituição de renda. Jogo e aposta. Fiança. Transação. Compromisso."},{"id":"civil-09","number":9,"label":"Atos unilaterais","full":"Atos unilaterais. Promessa de recompensa. Gestão de negócios. Pagamento indevido. Enriquecimento sem causa."},{"id":"civil-10","number":10,"label":"Responsabilidade civil","full":"Responsabilidade civil. Elementos. Responsabilidade por fato de outrem. Responsabilidade por fato da coisa. Teorias subjetiva e objetiva da responsabilidade civil. Responsabilidade civil nas Relações de Trabalho e Emprego. Dano moral e material. Dano coletivo. Dano estético. Dano à imagem. Indenização. Perda de uma chance. Nexo causal e suas teorias. Liquidação do dano. Responsabilidade pré e pós contratual. Responsabilidade contratual e aquiliana. Excludentes da responsabilidade civil. Boa-fé subjetiva e objetiva."},{"id":"civil-11","number":11,"label":"Posse e Detenção","full":"Posse e Detenção. Definição. Natureza jurídica. Classificação de posse. Aquisição da posse. Efeitos da posse. Composse. Proteção possessória. Perda da posse."},{"id":"civil-12","number":12,"label":"Propriedade","full":"Propriedade. Definição. Elementos. Classificação. Extensão da propriedade. Restrições à propriedade. Aquisição ou constituição da propriedade. Propriedade imóvel. Propriedade móvel. Propriedade resolúvel e fiduciária. Perda da propriedade móvel e imóvel. Usucapião. Função social da propriedade. Propriedade urbana e rural. Estatuto da Terra e Estatuto das Cidades. Política agrícola e reforma agrária. Direito de vizinhança. Enfiteuse e ocupação em terrenos de marinha. Registros de imóveis: noções gerais, registros, presunção de fé pública e imóveis da União. Prioridade, especialidade, legalidade, continuidade. Procedimento de dúvida. Direito de laje."},{"id":"civil-13","number":13,"label":"Condomínio","full":"Condomínio. Condomínio em geral. Condomínio edilício. Condomínio de lotes e condomínio urbano simples. Condomínio em multipropriedade. Parcelamento do solo urbano. Loteamentos de acesso restrito. Incorporação imobiliária."},{"id":"civil-14","number":14,"label":"Propriedade resolúvel","full":"Propriedade resolúvel. Propriedade fiduciária. Alienação fiduciária em garantia no Código Civil e na legislação extravagante. Propriedade fiduciária de imóveis. Cessão fiduciária de crédito. Patrimônio de afetação. Securitização."},{"id":"civil-15","number":15,"label":"Direitos reais sobre coisas próprias e alheias","full":"Direitos reais sobre coisas próprias e alheias. Direitos reais de garantia. Direitos reais de aquisição. Disposições gerais."},{"id":"civil-16","number":16,"label":"Estatuto da Criança e do Adolescente","full":"Estatuto da Criança e do Adolescente. Estatuto da Juventude. Estatuto do idoso."},{"id":"civil-17","number":17,"label":"Direitos das pessoas com deficiência: inclusão, direitos e garantias legais e constitucionais das pessoas com deficiência","full":"Direitos das pessoas com deficiência: inclusão, direitos e garantias legais e constitucionais das pessoas com deficiência. Normas gerais e critérios básicos para prioridade de atendimento e promoção da acessibilidade das pessoas com deficiência ou com mobilidade reduzida."},{"id":"civil-18","number":18,"label":"Marco Civil da Internet","full":"Marco Civil da Internet. Lei Geral de Proteção de Dados e proteção de dados pessoais."},{"id":"civil-19","number":19,"label":"Aspectos gerais do direito de família e das sucessões","full":"Aspectos gerais do direito de família e das sucessões. Casamento. União estável. Repercussões previdenciárias. Relações de parentesco. Regime de bens entre os cônjuges e os companheiros. Bem de família. Tutela. Curatela. Sucessão em geral: sucessão legítima e testamentária."},{"id":"civil-20","number":20,"label":"Direito do consumidor","full":"Direito do consumidor. Consumidor. Fornecedor. Direitos básicos do consumidor. Qualidade de produtos e serviços. Prevenção e reparação dos danos. Defesa do consumidor em juízo."},{"id":"civil-21","number":21,"label":"Marco legal das garantias (Lei n. 14.711/23)","full":"Marco legal das garantias (Lei n. 14.711/23)."}]},{"id":"empresarial","title":"Direito Empresarial","area":"Direito Empresarial","items":[{"id":"empresarial-01","number":1,"label":"Direito Comercial: origem","full":"Direito Comercial: origem. Evolução histórica. Autonomia. Fontes. Características. Empresário: caracterização. Inscrição. Capacidade. Teoria da empresa e seus perfis. Função social da empresa. Responsabilidade Ambiental, Social e de Governança na perspectiva do ESG (Environmental, Social and Governance). Empresário rural."},{"id":"empresarial-02","number":2,"label":"Teoria geral dos títulos de créditos","full":"Teoria geral dos títulos de créditos. Princípios gerais dos títulos de crédito: cartularidade, literalidade, autonomia e abstração. Títulos de créditos. Aceite, aval, endosso, protesto, prescrição. Ações cambiais. Títulos eletrônicos ou virtuais."},{"id":"empresarial-03","number":3,"label":"Teoria geral do direito societário: conceito de sociedade","full":"Teoria geral do direito societário: conceito de sociedade. Personalização da sociedade. Ato constitutivo das sociedades. Classificação das sociedades. Sociedades não personificadas. Sociedades personificadas: sociedade simples, sociedade em nome coletivo, sociedade em comandita simples, sociedade em comandita por ações, sociedade cooperada, sociedades coligadas, subsidiária integral, grupo societário e consórcio. Microempreendedor individual, microempresa e empresa de pequeno porte (Lei Complementar n. 123/2006 e suas alterações). A responsabilidade dos sócios. A distribuição de lucros. O sócio oculto. Segredo comercial."},{"id":"empresarial-04","number":4,"label":"Sociedade Limitada e Sociedade Anônima","full":"Sociedade Limitada e Sociedade Anônima. Sociedade limitada: cotas, administração, conselho fiscal, deliberação dos sócios, aumento e redução de capital, resolução da sociedade em relação a sócios minoritários e dissolução. Sociedade anônima: caraterísticas, órgãos e regulação pela Lei n. 6.404/1976 (Lei das S/A)."},{"id":"empresarial-05","number":5,"label":"Sociedades dependentes de autorização","full":"Sociedades dependentes de autorização. Liquidação. Transformação. Incorporação. Fusão. Cisão. Sociedades dependentes de autorização. Desconsideração da personalidade jurídica."},{"id":"empresarial-06","number":6,"label":"Estabelecimento Empresarial","full":"Estabelecimento Empresarial. Institutos Complementares do Direito Empresarial. Registro. Nome. Prepostos. Escrituração. Bens corpóreos e incorpóreos. Ponto comercial, fundo de comércio e trespasse."},{"id":"empresarial-07","number":7,"label":"Contratos empresariais","full":"Contratos empresariais. Intervenção mínima. Compra e venda mercantil. Comissão. Representação Comercial. Concessão comercial. Grupo Econômico. Sucessão Empresarial. Franquia (franchising). Distribuição. Alienação fiduciária em garantia. Faturização (factoring). Arrendamento mercantil (leasing). Cartão de crédito."},{"id":"empresarial-08","number":8,"label":"Contratos bancários","full":"Contratos bancários. Depósito bancário. Conta corrente. Aplicação financeira. Mútuo bancário. Desconto. Abertura de crédito. Crédito documentário."},{"id":"empresarial-09","number":9,"label":"Sistema Financeiro Nacional: Constituição","full":"Sistema Financeiro Nacional: Constituição. Competência de suas entidades integrantes. Instituições financeiras públicas e privadas. Liquidação extrajudicial de instituições financeiras. Sistema Financeiro da Habitação."},{"id":"empresarial-10","number":10,"label":"Noções gerais de recuperação judicial, recuperação extrajudicial e a falência do empresário e da sociedade empresária","full":"Noções gerais de recuperação judicial, recuperação extrajudicial e a falência do empresário e da sociedade empresária. Princípio da par conditio creditorum no sistema de recuperação e falência. Unidade, universalidade e indivisibilidade do juízo concursal. Procedimento pré- falimentar. Convolação da recuperação judicial em falência. Pressupostos, órgãos, caracterização e administração da falência. Efeitos da decretação de falência. Realização do ativo. Classificação e pagamentos dos credores. Encerramento da falência e extinção das obrigações do falido."},{"id":"empresarial-11","number":11,"label":"Noções gerais de propriedade intelectual e propriedade Industrial","full":"Noções gerais de propriedade intelectual e propriedade Industrial. Regime Jurídico. Invenção. Desenho Industrial. Modelo de Utilidade. Marca. Patente. Direito Autoral."},{"id":"empresarial-12","number":12,"label":"A Relação de Consumo no Direito do Espaço Virtual","full":"A Relação de Consumo no Direito do Espaço Virtual. O Código de Defesa do Consumidor e práticas comerciais. Qualidade de produtos e serviços, prevenção e reparação dos danos. Comércio Eletrônico. Contratos de adesão e aplicação do Código de Defesa do Consumidor. LGPD em relações empresariais."},{"id":"empresarial-13","number":13,"label":"Mudanças trazidas pela Lei n. 14.195/2021","full":"Mudanças trazidas pela Lei n. 14.195/2021. Criação do sistema integrado de recuperação de ativos. Consolidação da Sociedade Limitada Unipessoal e extinção da EIRELLI."}]},{"id":"penal","title":"Direito Penal","area":"Direito Penal","items":[{"id":"penal-01","number":1,"label":"Introdução ao Direito Penal","full":"Introdução ao Direito Penal. Conceito, características, finalidade e princípios gerais do Direito penal. (Des)criminalização e (des)penalização. Direito penal e política criminal. Direito penal e criminologia. Direito penal e outros ramos do Direito."},{"id":"penal-02","number":2,"label":"A Constituição Penal","full":"A Constituição Penal. Princípios de Direito penal constitucional. Princípios constitucionais influentes em matéria penal. Normas penais constitucionalizadas. Mandamentos de penalização."},{"id":"penal-03","number":3,"label":"A Norma Penal","full":"A Norma Penal. Características, fontes, interpretação, vigência e aplicação. Lei penal no tempo e no espaço; do tempo e do lugar do crime. Limites da aplicação da lei penal em relação às pessoas."},{"id":"penal-04","number":4,"label":"Teoria Geral do Crime","full":"Teoria Geral do Crime. Conceito, objeto, sujeitos, conduta. Crimes de dano e de perigo. Crimes materiais, formais e de mera conduta."},{"id":"penal-05","number":5,"label":"Tipicidade Objetiva","full":"Tipicidade Objetiva. Ação, resultado e relação de causalidade. Teoria da imputação objetiva. Da relevância penal da omissão."},{"id":"penal-06","number":6,"label":"Tipicidade subjetiva","full":"Tipicidade subjetiva. Crime doloso e crime culposo. Erro sobre elementos do tipo. Crime agravado pelo resultado e crime preterdoloso."},{"id":"penal-07","number":7,"label":"Iter Criminis","full":"Iter Criminis. Consumação e tentativa. Crime impossível. Desistência voluntária e arrependimento eficaz. Arrependimento posterior."},{"id":"penal-08","number":8,"label":"Antijuridicidade","full":"Antijuridicidade. Legítima defesa e do excesso. Estado de necessidade. Estrito cumprimento do dever legal. Exercício regular de direito."},{"id":"penal-09","number":9,"label":"Culpabilidade","full":"Culpabilidade. Fundamentos; conceito; elementos e conteúdo. Culpabilidade e pena. Causas de exclusão da culpabilidade. Erro de proibição. Descriminantes putativas."},{"id":"penal-10","number":10,"label":"Imputabilidade penal","full":"Imputabilidade penal. Inimputáveis e semi-imputáveis. Menoridade penal. Emoção e paixão. Embriaguez."},{"id":"penal-11","number":11,"label":"Concurso de agentes","full":"Concurso de agentes. Autoria e da participação. Teoria do domínio do fato."},{"id":"penal-12","number":12,"label":"Das penas","full":"Das penas. Teoria da pena. Cominação e aplicação das penas e dos substitutivos penais. Concurso de crimes e crime continuado. Concurso aparente de normas. Erro na execução e Resultado diverso do pretendido."},{"id":"penal-13","number":13,"label":"Dos efeitos da condenação","full":"Dos efeitos da condenação. Do confisco alargado de bens."},{"id":"penal-14","number":14,"label":"Da reabilitação","full":"Da reabilitação."},{"id":"penal-15","number":15,"label":"Das medidas de segurança","full":"Das medidas de segurança."},{"id":"penal-16","number":16,"label":"Da ação penal","full":"Da ação penal. Tipos de ação penal. Titularidade e legitimidade. Arquivamento do inquérito."},{"id":"penal-17","number":17,"label":"Da extinção da punibilidade","full":"Da extinção da punibilidade."},{"id":"penal-18","number":18,"label":"Direito penal econômico","full":"Direito penal econômico. Bem jurídico supraindividual. Responsabilidade penal das pessoas jurídicas."},{"id":"penal-19","number":19,"label":"A aplicação da Lei Penal Militar","full":"A aplicação da Lei Penal Militar. Código Penal Militar (art. 9º)."},{"id":"penal-20","number":20,"label":"Tratados e convenções em matéria criminal","full":"Tratados e convenções em matéria criminal. A Convenção das Nações Unidas contra o Tráfico de Entorpecentes e Substâncias Psicotrópicas. A Convenção das Nações Unidas contra o Crime Organizado Transnacional. A Convenção das Nações Unidas contra a Corrupção."},{"id":"penal-21","number":21,"label":"Dos crimes em espécie","full":"Dos crimes em espécie. Dos crimes previstos na parte especial do Código Penal: dos crimes contra a pessoa; dos crimes contra o patrimônio; dos crimes contra a organização do trabalho; dos crimes contra a dignidade sexual; dos crimes contra a fé pública; dos crimes contra a administração pública e administração da justiça. Crimes previstos nas Leis ns. 7.716/89, 12.288/2010 e 13.869/ 2019."}]}],"questions":[{"id":"e   <script>

(() => {
  const DATA = window.ENAM_DATA;
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const uid = (p='id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
  const iso = () => new Date().toISOString();
  const localDateKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const fmtMinutes = m => m < 60 ? `${Math.round(m)} min` : `${Math.floor(m/60)}h${Math.round(m%60) ? ` ${Math.round(m%60)}min` : ''}`;
  const fmtPct = (a,b) => b ? Math.round((a/b)*100) : 0;
  const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const addDays = (date, days) => { const d=new Date(date); d.setDate(d.getDate()+days); return d.toISOString(); };
  const subjectById = id => DATA.syllabus.find(s=>s.id===id);
  const subjectIdFromTitle = title => {
    const map={'Direito Constitucional':'constitucional','Direito Administrativo':'administrativo','Formação Humanística':'humanistica','Direitos Humanos':'direitos-humanos','Processo Civil':'processo-civil','Direito Civil':'civil','Direito Empresarial':'empresarial','Direito Penal':'penal'};
    return map[title] || '';
  };

  const defaultState = () => ({
    version:1,
    settings:{examDate:DATA.exam.date,sessionMinutes:50,targetScore:62,maxDailyBlocks:2},
    cycle:{number:1,completed:[],history:[]},
    syllabus:{}, laws:{}, questions:{}, sessions:[], activeTimer:null, simulations:[],
    notes:{jurisprudence:[]},
  });

  let state = defaultState();
  let page = 'today';
  let meta = {authenticated:true,persistence:'local'};
  let saveTimer = null;
  let clockInterval = null;
  let timerModalOpen = false;
  let mobileSidebarOpen = false;

  function mergeState(input){
    const base=defaultState();
    if(!input || typeof input!=='object') return base;
    return {...base,...input,settings:{...base.settings,...input.settings},cycle:{...base.cycle,...input.cycle},syllabus:input.syllabus||{},laws:input.laws||{},questions:input.questions||{},sessions:Array.isArray(input.sessions)?input.sessions:[],simulations:Array.isArray(input.simulations)?input.simulations:[],notes:{...base.notes,...input.notes}};
  }

  async function api(path, options={}){
    const res=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
    if(!res.ok){const err=new Error(`HTTP ${res.status}`); err.status=res.status; throw err;} return res.json();
  }

  async function boot(){
    try{meta=await api('/api/enam/meta');}
    catch{meta={authenticated:true,persistence:'local',authRequired:false};}
    if(meta.authRequired && !meta.authenticated){showLogin();return;}
    await loadState(); showApp(); initEvents(); render(); startClock();
  }

  async function loadState(){
    if(meta.persistence==='database' || meta.persistence==='file'){
      try{state=mergeState(await api('/api/enam/state')); return;}catch(e){if(e.status===401){showLogin();return;}}
    }
    try{state=mergeState(JSON.parse(localStorage.getItem('enam_portal_state_v1')||'null'));}catch{state=defaultState();}
  }

  function saveState(){
    $('#saveStatus').textContent='salvando…';
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      try{
        if(meta.persistence==='database' || meta.persistence==='file') await api('/api/enam/state',{method:'PUT',body:JSON.stringify(state)});
        else localStorage.setItem('enam_portal_state_v1',JSON.stringify(state));
        $('#saveStatus').textContent='salvo';
      }catch{$('#saveStatus').textContent='erro ao salvar';}
    },400);
  }

  function showLogin(){ $('#loginScreen').classList.remove('hidden'); $('#app').classList.add('hidden'); }
  function showApp(){ $('#loginScreen').classList.add('hidden'); $('#app').classList.remove('hidden'); }

  function initEvents(){
    $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;go(b.dataset.page);});
    $('.sidebar-bottom').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page);});
    $('#mobileMenu').onclick=()=>$('.portal-nav-wrap').classList.toggle('open');
    $('#timerPill').onclick=()=>openTimerModal();
    $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/enam/login',{method:'POST',body:JSON.stringify({password:$('#loginPassword').value})});location.reload();}catch{$('#loginError').textContent='Senha incorreta.';}};
  }

  function go(p){page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('.portal-nav-wrap').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
  const titles={today:'Hoje',cycle:'Ciclo de estudos',syllabus:'Conteúdo do edital',questions:'Questões FGV',laws:'Lei seca',review:'Revisão',performance:'Desempenho',settings:'Ajustes'};

  function render(){
    $('#pageTitle').textContent=titles[page]||'ENAM';
    const map={today:renderToday,cycle:renderCycle,syllabus:renderSyllabus,questions:renderQuestions,laws:renderLaws,review:renderReview,performance:renderPerformance,settings:renderSettings};
    $('#main').innerHTML=`<div class="page">${map[page]()}</div>`;
    bindPageEvents(); updateTopbar();
  }

  function updateTopbar(){
    const exam=new Date(`${state.settings.examDate}T13:00:00-03:00`); const now=new Date(); const days=Math.max(0,Math.ceil((exam-now)/86400000));
    $('#countdown').textContent=`${days} dias para a prova`;
    const active=state.activeTimer;
    $('#timerPill').classList.toggle('hidden',!active);
    if(active){$('#timerPillSubject').textContent=active.subject||active.title||'Foco';updateClockText();}
  }

  function phase(){
    const now=new Date(), exam=new Date(`${state.settings.examDate}T13:00:00-03:00`), days=(exam-now)/86400000;
    if(days<=14) return {id:'reta-final',name:'Reta final',desc:'Simulados completos, caderno de erros, lei seca e reparos cirúrgicos.',recipe:[['10','revisão'],['35','questões'],['5','erros']]};
    if(days<=30) return {id:'questoes',name:'Questões em primeiro plano',desc:'Menos aquisição e mais aplicação, jurisprudência e correção de erro.',recipe:[['10','conteúdo'],['35','questões'],['5','erros']]};
    if(days<=60) return {id:'consolidacao',name:'Consolidação',desc:'Conteúdo dirigido e volume crescente de questões.',recipe:[['20','conteúdo'],['25','questões'],['5','registro']]};
    return {id:'base',name:'Construção de base',desc:'Aquisição dirigida sem abandonar questões desde o primeiro ciclo.',recipe:[['30','conteúdo'],['15','questões'],['5','registro']]};
  }

  function cycleStatus(){
    const done=new Set(state.cycle.completed); const blocks=DATA.cycleBlocks;
    const next=blocks.find(b=>!done.has(b.id)) || blocks[0];
    return {done,next,completed:done.size,total:blocks.length};
  }
  function syllabusStats(){const items=DATA.syllabus.flatMap(s=>s.items);const done=items.filter(i=>state.syllabus[i.id]?.done).length;return {done,total:items.length,pct:fmtPct(done,items.length)};}
  function questionStats(){const all=Object.values(state.questions).filter(a=>a.submitted && !a.annulled);const correct=all.filter(a=>a.correct).length;return {answered:all.length,correct,pct:fmtPct(correct,all.length)};}
  function sessionMinutes(filterFn=()=>true){return state.sessions.filter(filterFn).reduce((a,s)=>a+(s.effectiveMinutes||0),0);}
  function startOfWeek(){const d=new Date();const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d;}
  function todaySessions(){const k=localDateKey();return state.sessions.filter(s=>localDateKey(new Date(s.endedAt||s.startedAt))===k);}
  function dueReviews(){const now=Date.now();return Object.entries(state.questions).filter(([,a])=>a.submitted && !a.correct && a.dueAt && new Date(a.dueAt).getTime()<=now);}

  function renderToday(){
    const c=cycleStatus(), sy=syllabusStats(), qs=questionStats(), ph=phase();
    const todayMin=sessionMinutes(s=>localDateKey(new Date(s.endedAt||s.startedAt))===localDateKey());
    const weekStart=startOfWeek();const weekMin=sessionMinutes(s=>new Date(s.endedAt||s.startedAt)>=weekStart);
    const reviews=dueReviews(); const blocksToday=todaySessions().filter(s=>s.kind==='cycle').length;
    const next=c.next;
    return `
      <div class="page-head"><div><div class="eyebrow">preparação enxuta · execução por ciclo</div><h1>O que importa agora</h1><p>Você não precisa montar a semana. Termine o próximo bloco, registre o que estudou e deixe o sistema guardar o resto.</p></div></div>
      ${meta.persistence!=='database'?`<div class="notice">Esta visualização está em modo ${meta.persistence==='local'?'local':'arquivo'}. Para uso definitivo no Railway, conecte um PostgreSQL para que o histórico fique persistente.</div>`:''}
      <div class="grid grid-4">
        ${stat('estudo hoje',fmtMinutes(todayMin),`${todaySessions().length} sessões`)}
        ${stat('esta semana',fmtMinutes(weekMin),'tempo líquido registrado')}
        ${stat('edital',`${sy.done}/${sy.total}`,`${sy.pct}% percorrido`)}
        ${stat('questões',qs.answered?`${qs.pct}%`:'—',qs.answered?`${qs.correct}/${qs.answered} acertos`:'ainda sem respostas')}
      </div>
      <div class="hero-session">
        <section class="card next-card">
          <div class="eyebrow">próximo bloco · ciclo ${state.cycle.number}</div>
          <h2>${esc(next.title)}</h2>
          <div class="mode">${esc(next.mode)}</div>
          <p>${esc(next.objective)}</p>
          <div class="next-meta"><div>ordem<strong>${next.order} de ${DATA.cycleBlocks.length}</strong></div><div>duração<strong>${state.settings.sessionMinutes} min</strong></div><div>ritmo normal<strong>até ${state.settings.maxDailyBlocks} blocos/dia</strong></div></div>

          ${blocksToday>=state.settings.maxDailyBlocks?`<p class="soft-note" style="margin-bottom:0">Você já completou ${blocksToday} blocos hoje. O teto diário é uma proteção de energia, não uma meta a ultrapassar.</p>`:''}
        </section>
        <section class="card phase-card"><div><div class="eyebrow">fase atual</div><div class="phase-title">${ph.name}</div><p class="soft-note">${ph.desc}</p><div class="phase-recipe">${ph.recipe.map(r=>`<div class="recipe-part"><strong>${r[0]}</strong><span>min · ${r[1]}</span></div>`).join('')}</div></div><div><div class="divider"></div><div class="soft-note">O formato muda sozinho conforme a prova se aproxima. O ciclo continua sendo a espinha dorsal.</div></div></section>
      </div>

      <div class="grid grid-2">
        <section class="card"><div class="score-band"><div class="score-point"><span>diagnóstico</span><strong>47/80</strong></div><div class="score-point"><span>corte</span><strong>56/80</strong></div><div class="score-point"><span>meta de segurança</span><strong>62–64</strong></div></div></section>
        <section class="card"><div class="today-list">
          ${todayRow('↻','Ciclo',`${c.completed}/${c.total} blocos concluídos`,`${fmtPct(c.completed,c.total)}%`)}

          ${todayRow('?','Banco FGV',`${320-qs.answered} questões ainda disponíveis`,'treinar','questions')}

  }
  function stat(label,value,small){return `<div class="card stat"><span class="label">${label}</span><strong>${value}</strong><small>${small}</small></div>`;}
  function todayRow(icon,title,sub,action,target=''){return `<div class="today-row"><div class="today-icon">${icon}</div><div><strong>${title}</strong><small>${sub}</small></div>${target?`<button class="button small" data-go="${target}">${action}</button>`:`<span class="chip">${action}</span>`}</div>`;}

  function renderCycle(){
    const c=cycleStatus();
    return `<div class="page-head"><div><div class="eyebrow">sem dias fixos</div><h1>Ciclo de estudos</h1><p>Se o escritório ocupar dois dias, o plano não quebra. Você retoma exatamente do próximo bloco.</p></div><div class="header-actions"><button class="button" data-action="new-cycle">Novo ciclo</button></div></div>
      <div class="grid grid-4">${stat('ciclo atual',state.cycle.number,'sequência contínua')}${stat('progresso',`${c.completed}/${c.total}`,`${fmtPct(c.completed,c.total)}% do ciclo`)}${stat('carga líquida',`${Math.round(DATA.cycleBlocks.length*state.settings.sessionMinutes/60)}h`,'por ciclo completo')}${stat('limite diário',state.settings.maxDailyBlocks,'blocos em dia normal')}</div>
      <div class="section-title"><div><h2>Sequência</h2><p>O próximo bloco é realçado. Concluir o timer encerra o bloco e abre o registro do edital.</p></div></div>
      <div class="cycle-list">${DATA.cycleBlocks.map(b=>cycleBlockHtml(b,c)).join('')}</div>`;
  }
  function cycleBlockHtml(b,c){const done=c.done.has(b.id), current=c.next.id===b.id;return `<div class="cycle-block ${done?'done':''} ${current?'current':''}"><div class="cycle-number">${done?'✓':b.order}</div><div class="cycle-main"><strong>${esc(b.title)}</strong><span>${esc(b.mode)} · ${esc(b.objective)}</span></div><div class="cycle-actions">${!done?`<button class="button small ${current?'primary':''}" data-action="start-block" data-id="${b.id}">Iniciar</button>`:''}<button class="button small" data-action="open-syllabus" data-subject="${b.subjectId}">Edital</button></div></div>`;}

  function renderSyllabus(){
    const sy=syllabusStats();
    return `<div class="page-head"><div><div class="eyebrow">anexo I · 134 itens</div><h1>Conteúdo do edital</h1><p>Marque o que foi efetivamente percorrido. Use “revisar” para separar cobertura de domínio.</p></div></div>
      <div class="grid grid-4">${stat('cobertura',`${sy.pct}%`,`${sy.done}/${sy.total} itens`)}${stat('a revisar',Object.values(state.syllabus).filter(x=>x.review).length,'itens sinalizados')}${stat('seguros',Object.values(state.syllabus).filter(x=>x.confidence==='seguro').length,'confiança alta')}${stat('jurisprudência','todas','súmulas, repetitivos e entendimento dominante')}</div>
      <div class="filters" style="margin-top:18px"><input id="syllabusSearch" class="search" placeholder="Buscar tema no edital…"><select id="syllabusStatus" class="select"><option value="all">todos</option><option value="todo">não estudados</option><option value="done">estudados</option><option value="review">marcados para revisar</option></select></div>
      <div id="syllabusList">${syllabusListHtml()}</div>`;
  }
  function syllabusListHtml(search='',status='all'){
    const q=search.trim().toLowerCase();
    return DATA.syllabus.map(s=>{
      const items=s.items.filter(i=>{const st=state.syllabus[i.id]||{};if(status==='todo'&&st.done)return false;if(status==='done'&&!st.done)return false;if(status==='review'&&!st.review)return false;return !q||`${i.label} ${i.full}`.toLowerCase().includes(q);});
      if(!items.length)return '';
      const d=s.items.filter(i=>state.syllabus[i.id]?.done).length;const pct=fmtPct(d,s.items.length);
      return `<section class="card subject-card" data-subject-card="${s.id}"><div class="subject-head" data-toggle-subject><div><h3>${esc(s.title)}</h3><small>${d}/${s.items.length} itens estudados</small></div><div class="subject-progress"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><small>${pct}%</small></div></div><div class="subject-body">${items.map(i=>syllabusItemHtml(i)).join('')}</div></section>`;
    }).join('') || `<div class="card empty">Nenhum item com esse filtro.</div>`;

  function syllabusItemHtml(i){const st=state.syllabus[i.id]||{};return `<div class="syllabus-item" data-syllabus-item="${i.id}"><button class="check ${st.done?'checked':''}" data-action="toggle-syllabus" data-id="${i.id}">${st.done?'✓':''}</button><div><div class="syllabus-title"><span style="color:var(--muted);margin-right:5px">${i.number}.</span>${esc(i.label)}</div><div class="syllabus-full">${esc(i.full)}</div></div><div class="item-tools"><button class="chip ${st.review?'active':''}" data-action="review-syllabus" data-id="${i.id}">revisar</button><button class="chip ${st.confidence==='seguro'?'active':''}" data-action="confidence-syllabus" data-id="${i.id}">${st.confidence==='seguro'?'seguro':st.confidence==='medio'?'médio':'confiança'}</button><button class="chip" data-action="expand-syllabus" data-id="${i.id}">texto</button></div></div>`;}

  function renderQuestions(){
    const qs=questionStats();
    return `<div class="page-head"><div><div class="eyebrow">1º ao 4º ENAM · tipo 1</div><h1>Questões FGV</h1><p>O original fica no caderno oficial. Aqui você registra resposta, grau de certeza, método de chute e erros para revisão.</p></div><div class="header-actions"><button class="button soft" data-action="guided-guess">Laboratório do chute</button></div></div>
      <div class="grid grid-4">${stat('respondidas',qs.answered,'de 320 disponíveis')}${stat('acertos',qs.answered?`${qs.pct}%`:'—',qs.answered?`${qs.correct} corretas`:'comece por um caderno novo')}${stat('chute orientado',guessStat('guided'),'taxa de acerto')}${stat('chute puro',guessStat('pure'),'taxa de acerto')}</div>
      <div class="filters" style="margin-top:18px"><select id="qExam" class="select"><option value="all">todos os exames</option><option value="1">1º ENAM</option><option value="2">2º ENAM</option><option value="3">3º ENAM</option><option value="4">4º ENAM</option></select><select id="qSubject" class="select"><option value="all">todas as matérias</option>${DATA.syllabus.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select><select id="qStatus" class="select"><option value="unanswered">não respondidas</option><option value="all">todas</option><option value="wrong">erros</option><option value="correct">acertos</option></select><button class="button" data-action="random-question">Questão aleatória</button></div>
      <div id="questionList" class="cycle-list">${questionListHtml()}</div>`;
  }
  function guessStat(mode){const all=Object.values(state.questions).filter(a=>a.submitted&&a.confidence===mode&&!a.annulled);if(!all.length)return '—';return `${fmtPct(all.filter(a=>a.correct).length,all.length)}%`;}
  function questionListHtml(exam='all',subject='all',status='unanswered'){
    let arr=DATA.questions.filter(q=>exam==='all'||String(q.examNumber)===String(exam)).filter(q=>subject==='all'||q.subjectId===subject).filter(q=>{const a=state.questions[q.id];if(status==='unanswered')return !a?.submitted;if(status==='wrong')return a?.submitted&&!a.correct&&!q.annulled;if(status==='correct')return a?.submitted&&a.correct;return true;});
    arr=arr.slice(0,80);
    if(!arr.length)return `<div class="card empty">Nenhuma questão com esse filtro.</div>`;
    return arr.map(q=>{const a=state.questions[q.id];let badge='<div class="answer-badge">—</div>';if(q.annulled)badge='<div class="answer-badge annul">*</div>';else if(a?.submitted)badge=`<div class="answer-badge ${a.correct?'ok':'wrong'}">${a.correct?'✓':'×'}</div>`;return `<div class="question-card"><div class="q-number">Q${q.number}<small>${q.exam}</small></div><div><strong>${esc(q.subject)}</strong><span class="meta">${a?.submitted?`Sua resposta: ${a.answer} · ${confidenceLabel(a.confidence)}`:'ainda não respondida'}</span></div><div style="display:flex;gap:7px;align-items:center">${badge}<button class="button small" data-action="open-question" data-id="${q.id}">${a?.submitted?'ver':'responder'}</button></div></div>`;}).join('');
  }
  function confidenceLabel(v){return ({knew:'sabia',between:'entre duas',guided:'chute orientado',pure:'chute puro'})[v]||'sem classificação';}

  function renderLaws(){
    const done=DATA.laws.filter(l=>state.laws[l.id]?.status==='done').length;
    const p1=DATA.laws.filter(l=>l.priority===1), p1done=p1.filter(l=>state.laws[l.id]?.status==='done').length;

      <div class="grid grid-4">${stat('concluídas',`${done}/${DATA.laws.length}`,'normas do inventário')}${stat('prioridade máxima',`${p1done}/${p1.length}`,'núcleo de leitura')}${stat('CNJ',DATA.laws.filter(l=>l.type==='CNJ').length,'resoluções e recomendações')}${stat('tratados',DATA.laws.filter(l=>l.type==='Tratado').length,'direitos humanos e penal')}</div>
      <div class="filters" style="margin-top:18px"><input id="lawSearch" class="search" placeholder="Buscar norma…"><select id="lawPriority" class="select"><option value="all">todas as prioridades</option><option value="1">prioridade máxima</option><option value="2">alta</option><option value="3">dirigida</option></select><select id="lawStatus" class="select"><option value="all">todos os status</option><option value="todo">não iniciadas</option><option value="reading">em leitura</option><option value="done">concluídas</option></select></div>

  function lawListHtml(search='',priority='all',status='all'){
