trodução às Normas do Direito Brasileiro","front":"LINDB, art. 4º — O que o juiz utiliza quando a lei for omissa?","answer":"Analogia, costumes e princípios gerais de direito.","source":"LINDB, art. 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":"fc_c9bf73fb32","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":1,"editalLabel":"Lei de Introdução às Normas do Direito Brasileiro","front":"LINDB, art. 5º — O que deve orientar a aplicação da lei pelo juiz?","answer":"Os fins sociais a que ela se dirige e as exigências do bem comum.","source":"LINDB, art. 5º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":"fc_64c0136513","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":2,"editalLabel":"Pessoas naturais","front":"CC, art. 2º — Quando começa a personalidade civil da pessoa natural e o que a lei põe a salvo desde a concepção?","answer":"A personalidade começa com o nascimento com vida; desde a concepção ficam a salvo os direitos do nascituro.","source":"CC, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_a6540e0c33","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"Pessoas jurídicas","front":"CC, art. 50 — Qual é o núcleo da desconsideração da personalidade jurídica?","answer":"Em caso de abuso da personalidade, caracterizado por desvio de finalidade ou confusão patrimonial, o juiz pode estender efeitos de certas obrigações aos bens particulares de administradores ou sócios beneficiados direta ou indiretamente pelo abuso.","source":"CC, art. 50","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_cddf396476","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":5,"editalLabel":"Fatos jurídicos","front":"CC, art. 113 — Como os negócios jurídicos devem ser interpretados?","answer":"Conforme a boa-fé e os usos do lugar de sua celebração, observados também os critérios legais dos parágrafos.","source":"CC, art. 113","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_9732c3c356","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":5,"editalLabel":"Fatos jurídicos","front":"CC, art. 187 — O que caracteriza abuso de direito?","answer":"Também comete ato ilícito o titular que, ao exercer um direito, excede manifestamente os limites impostos por seu fim econômico ou social, pela boa-fé ou pelos bons costumes.","source":"CC, art. 187","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_1815238923","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":6,"editalLabel":"Obrigações","front":"CC, art. 334 — Quando a consignação tem efeito de pagamento?","answer":"O depósito judicial ou em estabelecimento bancário da coisa devida, nos casos e forma legais, considera-se pagamento e extingue a obrigação.","source":"CC, art. 334","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_cfc9d1e374","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":6,"editalLabel":"Obrigações","front":"CC, art. 336 — Que requisitos o depósito deve reunir para ter força de pagamento?","answer":"Quanto às pessoas, ao objeto, ao modo e ao tempo, todos os requisitos sem os quais não é válido o pagamento.","source":"CC, art. 336","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_f4058cab5c","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Contratos em geral: teoria geral dos contratos","front":"CC, art. 421 — Qual princípio limita positivamente a liberdade contratual?","answer":"A liberdade contratual será exercida nos limites da função social do contrato.","source":"CC, art. 421","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_3dfd8ed5ba","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Contratos em geral: teoria geral dos contratos","front":"CC, art. 422 — Qual dever geral incide na conclusão e execução dos contratos?","answer":"Os contratantes devem guardar probidade e boa-fé.","source":"CC, art. 422","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_9e747accf4","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":10,"editalLabel":"Responsabilidade civil","front":"CC, art. 927, parágrafo único — Quando pode haver responsabilidade objetiva independentemente de culpa?","answer":"Nos casos especificados em lei ou quando a atividade normalmente desenvolvida pelo autor do dano implicar, por sua natureza, risco para os direitos de outrem.","source":"CC, art. 927, parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_5709b4bde1","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":19,"editalLabel":"Aspectos gerais do direito de família e das sucessões","front":"CC, art. 1.784 — O que estabelece o princípio da saisine?","answer":"Aberta a sucessão, a herança transmite-se desde logo aos herdeiros legítimos e testamentários.","source":"CC, art. 1.784","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_c7812ffdcd","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":20,"editalLabel":"Direito do consumidor","front":"CDC, art. 6º, VIII — Qual importante regra processual protege o consumidor quanto ao ônus da prova?","answer":"É direito básico a facilitação da defesa de seus direitos, inclusive com inversão do ônus da prova, a critério do juiz, quando verossímil a alegação ou quando hipossuficiente, segundo as regras ordinárias de experiência.","source":"CDC, art. 6º, VIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":"fc_4fea5212bb","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":20,"editalLabel":"Direito do consumidor","front":"CDC, art. 14 — Qual é a regra de responsabilidade do fornecedor de serviços por defeitos da prestação?","answer":"Responde independentemente da existência de culpa pelos danos causados por defeitos relativos à prestação dos serviços e por informações insuficientes ou inadequadas.","source":"CDC, art. 14, caput","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":"fc_299449144f","subjectId":"civil","subject":"Direito Civil","kind":"law","kindLabel":"Lei seca","editalItem":18,"editalLabel":"Marco Civil da Internet","front":"LGPD, art. 7º — O tratamento de dados pessoais exige sempre consentimento?","answer":"Não. O consentimento é uma das bases legais; o art. 7º prevê outras hipóteses legais de tratamento.","source":"LGPD, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm"},{"id":"fc_9bfd9800df","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":1,"editalLabel":"Direito Comercial: origem","front":"CC, art. 966 — Quem é considerado empresário?","answer":"Quem exerce profissionalmente atividade econômica organizada para a produção ou circulação de bens ou de serviços.","source":"CC, art. 966, caput","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_f17f8bf73a","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":1,"editalLabel":"Direito Comercial: origem","front":"CC, art. 966, parágrafo único — Profissão intelectual configura atividade empresária automaticamente?","answer":"Não. Quem exerce profissão intelectual, científica, literária ou artística não é empresário, salvo se o exercício da profissão constituir elemento de empresa.","source":"CC, art. 966, parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_a81e537e76","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":1,"editalLabel":"Direito Comercial: origem","front":"CC, art. 967 — Qual é a regra sobre inscrição do empresário?","answer":"É obrigatória a inscrição do empresário no Registro Público de Empresas Mercantis da respectiva sede antes do início de sua atividade.","source":"CC, art. 967","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_7fda8e7a97","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":4,"editalLabel":"Sociedade Limitada e Sociedade Anônima","front":"CC, art. 1.052 — Qual é a responsabilidade dos sócios na sociedade limitada?","answer":"É restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social.","source":"CC, art. 1.052, caput","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_022730ac26","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":4,"editalLabel":"Sociedade Limitada e Sociedade Anônima","front":"CC, art. 1.052, §1º — A sociedade limitada pode ser constituída por uma só pessoa?","answer":"Sim. Pode ser constituída por uma ou mais pessoas.","source":"CC, art. 1.052, §1º","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_3d2fabdf2b","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":4,"editalLabel":"Sociedade Limitada e Sociedade Anônima","front":"Lei 6.404/1976, art. 1º — Como se divide o capital da sociedade anônima e qual é a responsabilidade do acionista?","answer":"O capital divide-se em ações, e a responsabilidade dos acionistas limita-se ao preço de emissão das ações subscritas ou adquiridas.","source":"Lei 6.404/1976, art. 1º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"},{"id":"fc_69b1da97dc","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":10,"editalLabel":"Noções gerais de recuperação judicial, recuperação extrajudicial e a falência do empresário e da sociedade empresária","front":"Lei 11.101/2005, art. 47 — Qual é a finalidade da recuperação judicial?","answer":"Viabilizar a superação da crise econômico-financeira, permitindo manutenção da fonte produtora, emprego e interesses dos credores, preservando empresa, função social e estímulo à atividade econômica.","source":"Lei 11.101/2005, art. 47","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101.htm"},{"id":"fc_ddda7c30fc","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":10,"editalLabel":"Noções gerais de recuperação judicial, recuperação extrajudicial e a falência do empresário e da sociedade empresária","front":"Lei 11.101/2005, art. 49 — Qual é a regra geral sobre créditos sujeitos à recuperação judicial?","answer":"Estão sujeitos todos os créditos existentes na data do pedido, ainda que não vencidos, ressalvadas as exceções legais.","source":"Lei 11.101/2005, art. 49, caput","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101.htm"},{"id":"fc_bde9b0e7b9","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":10,"editalLabel":"Noções gerais de recuperação judicial, recuperação extrajudicial e a falência do empresário e da sociedade empresária","front":"Lei 11.101/2005, art. 6º — Qual é a ideia central do stay period na recuperação judicial?","answer":"O deferimento do processamento produz, nas hipóteses legais, suspensão de ações e execuções contra o devedor e proibição de certos atos constritivos, nos limites e prazos do art. 6º.","source":"Lei 11.101/2005, art. 6º","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101.htm"},{"id":"fc_b8383c41fa","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":13,"editalLabel":"Mudanças trazidas pela Lei n. 14.195/2021","front":"Lei 14.195/2021 — O que ocorreu com as EIRELIs existentes?","answer":"Foram transformadas em sociedades limitadas unipessoais, independentemente de alteração do ato constitutivo, conforme disciplina legal.","source":"Lei 14.195/2021, art. 41","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14195.htm"},{"id":"fc_b2718d921a","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":12,"editalLabel":"A Relação de Consumo no Direito do Espaço Virtual","front":"CDC, art. 49 — Qual é o prazo geral do direito de arrependimento em contratação fora do estabelecimento comercial?","answer":"7 dias a contar da assinatura do contrato ou do recebimento do produto ou serviço, especialmente por telefone ou a domicílio.","source":"CDC, art. 49","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":"fc_76e59e200c","subjectId":"empresarial","subject":"Direito Empresarial","kind":"law","kindLabel":"Lei seca","editalItem":2,"editalLabel":"Teoria geral dos títulos de créditos","front":"CC, art. 887 — Qual é a definição legal de título de crédito?","answer":"Documento necessário ao exercício do direito literal e autônomo nele contido, que somente produz efeito quando preenche os requisitos da lei.","source":"CC, art. 887","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":"fc_4717359553","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":1,"editalLabel":"Introdução ao Direito Penal","front":"CP, art. 1º — Qual é a fórmula do princípio da legalidade penal?","answer":"Não há crime sem lei anterior que o defina. Não há pena sem prévia cominação legal.","source":"CP, art. 1º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_86536b494d","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"A Norma Penal","front":"CP, art. 2º, parágrafo único — A lei penal mais benéfica retroage?","answer":"Sim. A lei posterior que de qualquer modo favorecer o agente aplica-se aos fatos anteriores, ainda que decididos por sentença condenatória transitada em julgado.","source":"CP, art. 2º, parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_73b48e2049","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"A Norma Penal","front":"CP, art. 4º — Qual teoria o Código Penal adota para o tempo do crime?","answer":"Teoria da atividade: considera-se praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado.","source":"CP, art. 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_603559ab45","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":5,"editalLabel":"Tipicidade Objetiva","front":"CP, art. 13 — Quando o resultado é imputável ao agente?","answer":"Quando quem lhe deu causa; considera-se causa a ação ou omissão sem a qual o resultado não teria ocorrido, observadas as regras do artigo.","source":"CP, art. 13","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_81be90ab76","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":5,"editalLabel":"Tipicidade Objetiva","front":"CP, art. 13, §2º — Quando a omissão é penalmente relevante?","answer":"Quando o omitente devia e podia agir para evitar o resultado; o dever de agir decorre das hipóteses das alíneas a, b e c.","source":"CP, art. 13, §2º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_c4abdfbfba","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Iter Criminis","front":"CP, art. 14, II — Quando há tentativa?","answer":"Quando, iniciada a execução, o crime não se consuma por circunstâncias alheias à vontade do agente.","source":"CP, art. 14, II","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_3d40988f6c","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Iter Criminis","front":"CP, art. 15 — Qual é a consequência da desistência voluntária e do arrependimento eficaz?","answer":"O agente responde apenas pelos atos já praticados.","source":"CP, art. 15","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_f694bf90b5","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Iter Criminis","front":"CP, art. 16 — Quais são os requisitos centrais do arrependimento posterior?","answer":"Crime sem violência ou grave ameaça; reparação do dano ou restituição da coisa até o recebimento da denúncia ou queixa; ato voluntário. A pena será reduzida de 1/3 a 2/3.","source":"CP, art. 16","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_df8c28dac0","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Iter Criminis","front":"CP, art. 17 — Quando há crime impossível?","answer":"Quando, por ineficácia absoluta do meio ou absoluta impropriedade do objeto, é impossível consumar-se o crime.","source":"CP, art. 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_3c04c4d7e2","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":6,"editalLabel":"Tipicidade subjetiva","front":"CP, art. 20 — Qual é o efeito do erro sobre elemento constitutivo do tipo legal de crime?","answer":"Exclui o dolo, mas permite punição por crime culposo se previsto em lei.","source":"CP, art. 20, caput","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_1a2d9b273e","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":9,"editalLabel":"Culpabilidade","front":"CP, art. 21 — Qual é a regra sobre erro de proibição?","answer":"O desconhecimento da lei é inescusável. Erro inevitável sobre a ilicitude isenta de pena; se evitável, pode reduzir a pena de 1/6 a 1/3.","source":"CP, art. 21","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_32d69c3a48","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":8,"editalLabel":"Antijuridicidade","front":"CP, arts. 23 e 25 — Quais excludentes de ilicitude estão no art. 23 e qual a definição legal de legítima defesa?","answer":"Art. 23: estado de necessidade, legítima defesa, estrito cumprimento do dever legal e exercício regular de direito. Legítima defesa: uso moderado dos meios necessários para repelir injusta agressão, atual ou iminente, a direito próprio ou alheio.","source":"CP, arts. 23 e 25","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_7e6fe5edd9","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":10,"editalLabel":"Imputabilidade penal","front":"CP, art. 26 — Qual é a regra de inimputabilidade por doença mental ou desenvolvimento mental incompleto/retardado?","answer":"É isento de pena o agente que, ao tempo da ação ou omissão, era inteiramente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.","source":"CP, art. 26, caput","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_eda7cd6810","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":11,"editalLabel":"Concurso de agentes","front":"CP, art. 29 — Qual é a regra geral do concurso de pessoas?","answer":"Quem, de qualquer modo, concorre para o crime incide nas penas a ele cominadas, na medida de sua culpabilidade.","source":"CP, art. 29, caput","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_13acafd2ee","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":17,"editalLabel":"Da extinção da punibilidade","front":"CP, art. 107 — O rol de causas extintivas da punibilidade é taxativo?","answer":"O art. 107 enumera causas como morte do agente, anistia/graça/indulto, retroatividade de lei que não mais considera o fato criminoso, prescrição/decadência/perempção, renúncia/perdão, retratação e perdão judicial nos casos previstos.","source":"CP, art. 107","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":"fc_6debdf2fd4","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":19,"editalLabel":"A aplicação da Lei Penal Militar","front":"CPM, art. 9º — Por que esse artigo merece leitura literal para o ENAM?","answer":"Porque o edital menciona expressamente o art. 9º do Código Penal Militar, que define as hipóteses de crimes militares em tempo de paz.","source":"CPM, art. 9º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del1001.htm"},{"id":"fc_98917e8af6","subjectId":"penal","subject":"Direito Penal","kind":"law","kindLabel":"Lei seca","editalItem":21,"editalLabel":"Dos crimes em espécie","front":"Lei 13.869/2019, art. 1º, §1º — Os crimes de abuso de autoridade exigem finalidade específica?","answer":"Sim. Exigem finalidade específica de prejudicar outrem ou beneficiar a si ou terceiro, ou mero capricho ou satisfação pessoal.","source":"Lei 13.869/2019, art. 1º, §1º","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13869.htm"},{"id":"fc_08931ed0e3","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":6,"editalLabel":"Os direitos humanos na Constituição Federal de 1988","front":"CF, art. 5º, §2º — O rol de direitos fundamentais da Constituição é fechado?","answer":"Não. Os direitos e garantias expressos não excluem outros decorrentes do regime e dos princípios adotados ou dos tratados internacionais de que o Brasil seja parte.","source":"CF, art. 5º, §2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":"fc_0d11b937d0","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":5,"editalLabel":"A relação entre o direito internacional dos direitos humanos e o direito brasileiro","front":"CF, art. 5º, §3º — Quando tratado de direitos humanos equivale a emenda constitucional?","answer":"Quando aprovado em cada Casa do Congresso, em dois turnos, por 3/5 dos votos dos respectivos membros.","source":"CF, art. 5º, §3º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":"fc_de2eab3dba","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":5,"editalLabel":"A relação entre o direito internacional dos direitos humanos e o direito brasileiro","front":"CF, art. 5º, §4º — A qual jurisdição internacional o Brasil se submete nos termos constitucionais?","answer":"À jurisdição de Tribunal Penal Internacional a cuja criação tenha manifestado adesão.","source":"CF, art. 5º, §4º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":"fc_76c735f2cf","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":8,"editalLabel":"Os princípios que regem as relações internacionais do Brasil","front":"CF, art. 4º, II — Qual princípio rege as relações internacionais do Brasil e é central para Direitos Humanos?","answer":"Prevalência dos direitos humanos.","source":"CF, art. 4º, II","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":"fc_146a7dec8e","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"Sistema regional interamericano de proteção dos direitos humanos","front":"CADH, art. 7.5 — Qual garantia deve ser observada após a prisão de uma pessoa?","answer":"A pessoa detida deve ser conduzida, sem demora, à presença de um juiz ou outra autoridade autorizada por lei a exercer funções judiciais.","source":"CADH, art. 7.5","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":"fc_e7580d56ea","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"Sistema regional interamericano de proteção dos direitos humanos","front":"CADH, art. 7.7 — Qual prisão por dívida é admitida como exceção na Convenção Americana?","answer":"A decorrente de inadimplemento de obrigação alimentar.","source":"CADH, art. 7.7","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":"fc_7e0a3bbf24","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"Sistema regional interamericano de proteção dos direitos humanos","front":"CADH, art. 8.1 — Qual é o núcleo das garantias judiciais na Convenção Americana?","answer":"Direito de ser ouvido, com as devidas garantias e em prazo razoável, por juiz ou tribunal competente, independente e imparcial, estabelecido anteriormente por lei.","source":"CADH, art. 8.1","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":"fc_4ccbc2e09c","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"Sistema regional interamericano de proteção dos direitos humanos","front":"CADH, art. 25 — O que é a proteção judicial?","answer":"Direito a recurso simples, rápido ou efetivo perante juízes ou tribunais competentes contra atos que violem direitos fundamentais reconhecidos pela Constituição, lei ou Convenção.","source":"CADH, art. 25","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":"fc_9848dcbdaa","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":9,"editalLabel":"Direitos dos Povos Originários","front":"Convenção OIT 169, art. 6º — Qual dever estatal é central quando medidas legislativas ou administrativas possam afetar diretamente povos interessados?","answer":"Consultar os povos interessados, mediante procedimentos apropriados e por meio de suas instituições representativas, com boa-fé e objetivo de alcançar acordo ou consentimento.","source":"Convenção OIT 169, art. 6º","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/decreto/d10088.htm"},{"id":"fc_fa2ab6ad56","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"law","kindLabel":"Lei seca","editalItem":9,"editalLabel":"Direitos dos Povos Originários","front":"Convenção OIT 169 — Qual é a ideia central de participação dos povos indígenas e tribais nas decisões que lhes digam respeito?","answer":"Devem participar livremente, ao menos na mesma medida que outros setores da população, na adoção de decisões em instituições eletivas e organismos administrativos e outros responsáveis por políticas e programas que lhes concernem.","source":"Convenção OIT 169, art. 6º, b","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/decreto/d10088.htm"},{"id":"fc_675b4410c2","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":8,"editalLabel":"Cognição do juiz e tomada de decisão","front":"LINDB, art. 20 — Que tipo de raciocínio decisório é exigido quando se invocam valores jurídicos abstratos?","answer":"A decisão deve considerar as consequências práticas, e sua motivação deve demonstrar necessidade e adequação da medida ou invalidação, inclusive diante de alternativas possíveis.","source":"LINDB, art. 20","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":"fc_edb06dfd12","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":8,"editalLabel":"Cognição do juiz e tomada de decisão","front":"LINDB, art. 21 — O que a decisão que invalida ato administrativo deve enfrentar além da própria invalidade?","answer":"Suas consequências jurídicas e administrativas e, quando cabível, condições para regularização proporcional e equânime, sem impor ônus anormais ou excessivos.","source":"LINDB, art. 21","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":"fc_e346dbba51","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":8,"editalLabel":"Cognição do juiz e tomada de decisão","front":"LINDB, art. 22 — Como as circunstâncias concretas da gestão pública entram na interpretação?","answer":"Devem ser considerados os obstáculos e dificuldades reais do gestor e as exigências das políticas públicas, sem prejuízo dos direitos dos administrados.","source":"LINDB, art. 22","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":"fc_d409fd8818","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"Ética e estatuto jurídico da magistratura nacional","front":"Código de Ética da Magistratura (Res. CNJ 60/2008), art. 1º — Quais valores/princípios devem nortear a magistratura?","answer":"Independência, imparcialidade, conhecimento e capacitação, cortesia, transparência, segredo profissional, prudência, diligência, integridade profissional e pessoal, dignidade, honra e decoro.","source":"Resolução CNJ 60/2008, Código de Ética, art. 1º","url":"https://atos.cnj.jus.br/atos/detalhar/127"},{"id":"fc_a7e48d0a19","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":3,"editalLabel":"Ética e estatuto jurídico da magistratura nacional","front":"Código de Ética da Magistratura, art. 7º — Que atividade é vedada em razão da independência judicial?","answer":"Participar de atividade político-partidária.","source":"Resolução CNJ 60/2008, Código de Ética, art. 7º","url":"https://atos.cnj.jus.br/atos/detalhar/127"},{"id":"fc_2fe750c07f","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":5,"editalLabel":"Teoria Geral do Direito","front":"Resolução CNJ 125/2010, art. 1º — Qual política pública ela institui?","answer":"A Política Judiciária Nacional de Tratamento Adequado dos Conflitos de Interesses, assegurando solução por meios adequados à natureza e peculiaridade dos conflitos.","source":"Resolução CNJ 125/2010, art. 1º","url":"https://atos.cnj.jus.br/atos/detalhar/156"},{"id":"fc_32a123d875","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":2,"editalLabel":"Psicologia Judiciária","front":"Resolução CNJ 351/2020 — Qual política ela institui no Poder Judiciário?","answer":"Política de Prevenção e Enfrentamento do Assédio Moral, do Assédio Sexual e da Discriminação.","source":"Resolução CNJ 351/2020, ementa e art. 1º","url":"https://atos.cnj.jus.br/atos/detalhar/3557"},{"id":"fc_cc933f93c9","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Direito Digital","front":"Resolução CNJ 615/2025 — Qual é seu objeto central?","answer":"Estabelecer diretrizes para desenvolvimento, utilização e governança de soluções com recursos de inteligência artificial no Poder Judiciário.","source":"Resolução CNJ 615/2025","url":"https://atos.cnj.jus.br/files/compilado1243232026032669c529ebd7bbb.pdf"},{"id":"fc_888d7c1169","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":7,"editalLabel":"Direito Digital","front":"Resolução CNJ 615/2025 — Que valores devem orientar o uso de IA no Judiciário?","answer":"Entre outros, dignidade humana, direitos humanos, não discriminação, devido processo, motivação/fundamentação, transparência, prestação de contas e responsabilização, conforme a disciplina atual da resolução.","source":"Resolução CNJ 615/2025, texto compilado","url":"https://atos.cnj.jus.br/files/compilado1243232026032669c529ebd7bbb.pdf"},{"id":"fc_0301429c32","subjectId":"humanistica","subject":"Formação Humanística","kind":"law","kindLabel":"Lei seca","editalItem":9,"editalLabel":"Direito da antidiscriminação","front":"Lei 7.716/1989 — O que a lei pune em seu núcleo geral?","answer":"Crimes resultantes de discriminação ou preconceito de raça, cor, etnia, religião ou procedência nacional, com extensão jurisprudencial vinculante à homotransfobia enquanto persistir omissão legislativa.","source":"Lei 7.716/1989 + ADO 26/STF","url":"https://www.planalto.gov.br/ccivil_03/leis/l7716compilado.htm"},{"id":"fc_e6db369d30","subjectId":"constitucional","subject":"Direito Constitucional","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":15,"editalLabel":"Controle de constitucionalidade (formas e tipos)","front":"SV 10/STF — Órgão fracionário pode afastar a incidência de lei por inconstitucionalidade sem submeter a questão ao plenário?","answer":"Não. Viola a reserva de plenário quando órgão fracionário afasta a incidência de lei ou ato normativo, no todo ou em parte, ainda que não declare expressamente a inconstitucionalidade.","source":"STF, Súmula Vinculante 10","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1216"},{"id":"fc_724cc8e51a","subjectId":"constitucional","subject":"Direito Constitucional","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":11,"editalLabel":"Poder Executivo","front":"SV 13/STF — Qual é o núcleo da vedação ao nepotismo?","answer":"A nomeação de cônjuge, companheiro ou parente até o 3º grau, inclusive por afinidade, da autoridade nomeante ou de servidor da mesma pessoa jurídica investido em direção, chefia ou assessoramento, para cargo em comissão/confiança ou função gratificada, inclusive por designações recíprocas, viola a Constituição.","source":"STF, Súmula Vinculante 13","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1229"},{"id":"fc_bb95bed7a3","subjectId":"constitucional","subject":"Direito Constitucional","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":12,"editalLabel":"Poder Judiciário","front":"ADI 3367/STF — A criação do Conselho Nacional de Justiça pela EC 45/2004 é compatível com a Constituição?","answer":"Sim. O STF reconheceu a constitucionalidade do CNJ e de sua inserção na estrutura do Poder Judiciário, preservada a função jurisdicional dos tribunais.","source":"STF, ADI 3367","url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=2260590"},{"id":"fc_2679e9cc42","subjectId":"constitucional","subject":"Direito Constitucional","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":6,"editalLabel":"Teoria geral dos direitos fundamentais","front":"ADI 4275/STF — Pessoa trans precisa de cirurgia ou laudo de terceiros para alterar prenome e gênero no registro civil?","answer":"Não. O STF reconheceu direito à alteração pela via administrativa ou judicial, por autoidentificação, independentemente de cirurgia, tratamento hormonal ou laudos de terceiros.","source":"STF, ADI 4275","url":"https://portal.stf.jus.br/peticaoInicial/verPeticaoInicial.asp?base=ADI&numProcesso=4275"},{"id":"fc_fd784953a3","subjectId":"administrativo","subject":"Direito Administrativo","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":18,"editalLabel":"Controle da atividade administrativa","front":"SV 3/STF — Em processos perante o TCU, quando se asseguram contraditório e ampla defesa?","answer":"Quando da decisão puder resultar anulação ou revogação de ato administrativo que beneficie o interessado, excetuada a apreciação da legalidade do ato de concessão inicial de aposentadoria, reforma e pensão.","source":"STF, Súmula Vinculante 3","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1191"},{"id":"fc_3013342e16","subjectId":"administrativo","subject":"Direito Administrativo","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":7,"editalLabel":"Processo Administrativo","front":"SV 5/STF — A ausência de advogado no processo administrativo disciplinar gera, por si só, nulidade constitucional?","answer":"Não. A falta de defesa técnica por advogado no PAD não ofende a Constituição.","source":"STF, Súmula Vinculante 5","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1199"},{"id":"fc_ff45fa09d4","subjectId":"administrativo","subject":"Direito Administrativo","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":16,"editalLabel":"Agentes públicos","front":"SV 43/STF — É constitucional o provimento derivado que permita ingresso em cargo de carreira distinta sem novo concurso?","answer":"Não. É inconstitucional modalidade de provimento que permita ao servidor investir-se, sem concurso destinado ao cargo, em cargo que não integra a carreira na qual já estava investido.","source":"STF, Súmula Vinculante 43","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=2348"},{"id":"fc_9b7dfe2856","subjectId":"administrativo","subject":"Direito Administrativo","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":18,"editalLabel":"Controle da atividade administrativa","front":"Tema 445/STF — Qual prazo têm os Tribunais de Contas para julgar a legalidade do ato inicial de aposentadoria, reforma ou pensão?","answer":"Cinco anos, contados da chegada do processo à respectiva Corte de Contas, em atenção à segurança jurídica e à confiança legítima.","source":"STF, Tema 445 da repercussão geral","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=445"},{"id":"fc_7b0a08db71","subjectId":"administrativo","subject":"Direito Administrativo","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":1,"editalLabel":"Administração Pública e Constituição","front":"SV 13/STF — A vedação ao nepotismo depende de lei formal específica?","answer":"Não. O STF assentou que a vedação decorre diretamente dos princípios do art. 37, caput, da Constituição.","source":"STF, Súmula Vinculante 13 / ADC 12","url":"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=115820"},{"id":"fc_9e045b6b6a","subjectId":"processo-civil","subject":"Processo Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":10,"editalLabel":"Tutela provisória: conceito, função, espécies","front":"Tema 902/STJ — A sustação judicial de protesto exige contracautela?","answer":"Sim. Por restringir direito do credor, a sustação de protesto exige prévio oferecimento de contracautela, fixada conforme o prudente arbítrio do magistrado.","source":"STJ, Tema Repetitivo 902","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=902&cod_tema_inicial=902&novaConsulta=true&tipo_pesquisa=T"},{"id":"fc_0957465c16","subjectId":"processo-civil","subject":"Processo Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":19,"editalLabel":"Procedimentos especiais e sua relação com o procedimento comum","front":"Tema 967/STJ — Qual é o efeito de depósito insuficiente na ação consignatória?","answer":"Conduz à improcedência do pedido, pois o pagamento parcial da dívida não extingue o vínculo obrigacional.","source":"STJ, Tema Repetitivo 967","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=967&cod_tema_inicial=967&novaConsulta=true&tipo_pesquisa=T"},{"id":"fc_7f028d111d","subjectId":"processo-civil","subject":"Processo Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":19,"editalLabel":"Procedimentos especiais e sua relação com o procedimento comum","front":"Tema 1040/STJ — Quando deve ser analisada a contestação em busca e apreensão do DL 911/1969?","answer":"Somente após a execução da medida liminar. A tese trata do momento da análise, não de proibição de apresentação antecipada da contestação.","source":"STJ, Tema Repetitivo 1040","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=1040&cod_tema_inicial=1040&novaConsulta=true&tipo_pesquisa=T"},{"id":"fc_04e785f5db","subjectId":"processo-civil","subject":"Processo Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":9,"editalLabel":"Atos não decisórios do juiz","front":"Tema 339/STF — O art. 93, IX, exige que o juiz responda pormenorizadamente a toda alegação das partes?","answer":"Não. O STF entende que a decisão deve ser fundamentada, ainda que sucintamente, sem necessidade de exame pormenorizado de cada alegação ou prova.","source":"STF, Tema 339 da repercussão geral","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=339"},{"id":"fc_4c757c26ed","subjectId":"processo-civil","subject":"Processo Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":7,"editalLabel":"Petição inicial","front":"Tema 1198/STJ — Diante de indícios de litigância abusiva, o juiz pode exigir documentos adicionais na inicial?","answer":"Sim. De modo fundamentado e razoável, pode exigir emenda para demonstrar interesse de agir e autenticidade da postulação, respeitadas as regras do ônus da prova.","source":"STJ, Tema Repetitivo 1198","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_inicial=1198&novaConsulta=true&tipo_pesquisa=T"},{"id":"fc_5e00a88c46","subjectId":"civil","subject":"Direito Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":19,"editalLabel":"Aspectos gerais do direito de família e das sucessões","front":"Tema 1200/STJ — Qual é o termo inicial da prescrição da petição de herança proposta por filho reconhecido após a morte?","answer":"A abertura da sucessão. A ação de reconhecimento de filiação não impede, suspende nem interrompe a fluência, independentemente de trânsito em julgado.","source":"STJ, Tema Repetitivo 1200","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=1200&cod_tema_inicial=1200&novaConsulta=true&tipo_pesquisa=T"},{"id":"fc_b78b7d5f4b","subjectId":"civil","subject":"Direito Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":19,"editalLabel":"Aspectos gerais do direito de família e das sucessões","front":"Tema 809/STF — É constitucional regime sucessório diferente para cônjuge e companheiro?","answer":"Não. É inconstitucional a distinção; aplica-se à união estável o regime sucessório do art. 1.829 do Código Civil.","source":"STF, Tema 809 da repercussão geral","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=809"},{"id":"fc_53da805d53","subjectId":"civil","subject":"Direito Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":19,"editalLabel":"Aspectos gerais do direito de família e das sucessões","front":"Tema 622/STF — A paternidade socioafetiva impede reconhecimento concomitante da filiação biológica?","answer":"Não. A paternidade socioafetiva, declarada ou não em registro, não impede reconhecimento concomitante do vínculo biológico, com efeitos jurídicos próprios.","source":"STF, Tema 622 da repercussão geral","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=622"},{"id":"fc_5d4572b611","subjectId":"civil","subject":"Direito Civil","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":2,"editalLabel":"Pessoas naturais","front":"ADI 4275/STF — Qual é a tese essencial sobre identidade de gênero e registro civil?","answer":"A pessoa transgênero pode alterar prenome e classificação de gênero por via administrativa ou judicial, independentemente de cirurgia ou laudos de terceiros.","source":"STF, ADI 4275","url":"https://portal.stf.jus.br/peticaoInicial/verPeticaoInicial.asp?base=ADI&numProcesso=4275"},{"id":"fc_7a65da2afa","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":5,"editalLabel":"A relação entre o direito internacional dos direitos humanos e o direito brasileiro","front":"SV 25/STF — É lícita a prisão civil do depositário infiel?","answer":"Não. É ilícita, qualquer que seja a modalidade do depósito.","source":"STF, Súmula Vinculante 25","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1268"},{"id":"fc_62c4cb164d","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":7,"editalLabel":"A jurisprudência do Supremo Tribunal Federal em matéria de direitos humanos","front":"ADO 26/STF — Como o STF tratou a homofobia e a transfobia enquanto persiste omissão legislativa?","answer":"Reconheceu a mora inconstitucional e determinou enquadramento das condutas homotransfóbicas nos tipos da Lei 7.716/1989, com efeitos nos termos do julgamento, até legislação autônoma.","source":"STF, ADO 26","url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=4515053"},{"id":"fc_ee400fb8be","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":7,"editalLabel":"A jurisprudência do Supremo Tribunal Federal em matéria de direitos humanos","front":"ADI 4275/STF — Qual direito fundamental foi reconhecido às pessoas trans em matéria registral?","answer":"Alteração de prenome e gênero no registro civil por autoidentificação, sem exigir cirurgia, hormonioterapia ou laudos de terceiros.","source":"STF, ADI 4275","url":"https://portal.stf.jus.br/peticaoInicial/verPeticaoInicial.asp?base=ADI&numProcesso=4275"},{"id":"fc_8e3d9b92e8","subjectId":"direitos-humanos","subject":"Direitos Humanos","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":7,"editalLabel":"A jurisprudência do Supremo Tribunal Federal em matéria de direitos humanos","front":"ADPF 347/STF — Qual conceito estrutural foi reconhecido em relação ao sistema penitenciário brasileiro?","answer":"Estado de coisas inconstitucional, diante de violações massivas e persistentes de direitos fundamentais e falhas estruturais.","source":"STF, ADPF 347 (medidas e decisões estruturais)","url":"https://portal.stf.jus.br/peticaoInicial/verPeticaoInicial.asp?base=ADPF&numProcesso=347"},{"id":"fc_5c59491221","subjectId":"humanistica","subject":"Formação Humanística","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":3,"editalLabel":"Ética e estatuto jurídico da magistratura nacional","front":"ADI 3367/STF — O CNJ viola a separação dos Poderes ou a autonomia do Judiciário?","answer":"Não. O STF reconheceu a constitucionalidade do CNJ, órgão integrante do Judiciário com atribuições administrativas, financeiras e disciplinares nos limites constitucionais.","source":"STF, ADI 3367","url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=2260590"},{"id":"fc_2c971ca38f","subjectId":"humanistica","subject":"Formação Humanística","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":3,"editalLabel":"Ética e estatuto jurídico da magistratura nacional","front":"ADC 12/STF — Qual norma do CNJ sobre nepotismo teve a constitucionalidade reconhecida?","answer":"A Resolução CNJ 7/2005; o julgamento reforçou a vedação ao nepotismo e foi seguido pela Súmula Vinculante 13.","source":"STF, ADC 12","url":"https://portal.stf.jus.br/peticaoInicial/verPeticaoInicial.asp?base=ADC&numProcesso=12"},{"id":"fc_03f5f057c0","subjectId":"humanistica","subject":"Formação Humanística","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":9,"editalLabel":"Direito da antidiscriminação","front":"ADO 26/STF — Qual a relevância da decisão para direito da antidiscriminação?","answer":"Reconheceu a omissão legislativa inconstitucional e aplicou a Lei 7.716/1989 às condutas homotransfóbicas até edição de legislação autônoma, nos termos do julgamento.","source":"STF, ADO 26","url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=4515053"},{"id":"fc_01bd74e731","subjectId":"penal","subject":"Direito Penal","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":21,"editalLabel":"Dos crimes em espécie","front":"SV 24/STF — Quando se tipifica o crime material do art. 1º, I a IV, da Lei 8.137/1990?","answer":"Somente após o lançamento definitivo do tributo.","source":"STF, Súmula Vinculante 24","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1184"},{"id":"fc_f148d57ac9","subjectId":"penal","subject":"Direito Penal","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":12,"editalLabel":"Das penas","front":"SV 26/STF — O que deve ser observado para progressão de regime em crime hediondo ou equiparado?","answer":"O juízo deve observar a inconstitucionalidade da antiga vedação absoluta à progressão e avaliar os requisitos objetivos e subjetivos, podendo determinar exame criminológico fundamentadamente.","source":"STF, Súmula Vinculante 26","url":"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1271"},{"id":"fc_1c1f6e8a7f","subjectId":"penal","subject":"Direito Penal","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":21,"editalLabel":"Dos crimes em espécie","front":"ADO 26/STF — Como a homotransfobia é tratada penalmente enquanto não houver lei autônoma?","answer":"Nos termos do julgamento vinculante, enquadra-se nos tipos penais da Lei 7.716/1989 até que sobrevenha legislação autônoma.","source":"STF, ADO 26","url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=4515053"},{"id":"fc_8b5598f263","subjectId":"penal","subject":"Direito Penal","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":8,"editalLabel":"Antijuridicidade","front":"ADPF 779/STF — A tese de “legítima defesa da honra” é compatível com a Constituição?","answer":"Não. O STF excluiu do âmbito da legítima defesa qualquer interpretação que admita a chamada legítima defesa da honra.","source":"STF, ADPF 779","url":"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=511556"},{"id":"fc_a955f7484e","subjectId":"empresarial","subject":"Direito Empresarial","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":10,"editalLabel":"Noções gerais de recuperação judicial, recuperação extrajudicial e a falência do empresário e da sociedade empresária","front":"Tema 1051/STJ — Para sujeição aos efeitos da recuperação judicial, quando se considera existente o crédito?","answer":"A existência do crédito é determinada pela data em que ocorreu o seu fato gerador, e não pelo trânsito em julgado da decisão que o reconhece.","source":"STJ, Tema Repetitivo 1051","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=1051&cod_tema_inicial=1051&novaConsulta=true&tipo_pesquisa=T"},{"id":"fc_0b61899378","subjectId":"empresarial","subject":"Direito Empresarial","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":2,"editalLabel":"Teoria geral dos títulos de créditos","front":"Tema 902/STJ — O que ocorre com a sustação de protesto de título em relação à contracautela?","answer":"A sustação judicial do protesto exige prévio oferecimento de contracautela, por representar restrição a direito do credor.","source":"STJ, Tema Repetitivo 902","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=902&cod_tema_inicial=902&novaConsulta=true&tipo_pesquisa=T"},{"id":"fc_1417fcf973","subjectId":"empresarial","subject":"Direito Empresarial","kind":"precedent","kindLabel":"Precedente vinculante","editalItem":7,"editalLabel":"Contratos empresariais","front":"Tema 1040/STJ — Em busca e apreensão fiduciária, quando se analisa a contestação?","answer":"Após a execução da medida liminar, nos termos do Tema 1040/STJ.","source":"STJ, Tema Repetitivo 1040","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=1040&cod_tema_inicial=1040&novaConsulta=true&tipo_pesquisa=T"}];
</script>
  <script>

(() => {
  const DATA = window.ENAM_DATA;
  const FLASHCARDS = window.ENAM_FLASHCARDS || [];
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const uid = (p='id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
  const iso = () => new Date().toISOString();
  const localDateKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const fmtMinutes = m => m < 60 ? `${Math.round(m)} min` : `${Math.floor(m/60)}h${Math.round(m%60) ? ` ${Math.round(m%60)}min` : ''}`;
  const fmtPct = (a,b) => b ? Math.round((a/b)*100) : 0;
  const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const addDays = (date, days) => { const d=new Date(date); d.setDate(d.getDate()+days); return d.toISOString(); };
  const subjectById = id => DATA.syllabus.find(s=>s.id===id);
  const subjectIdFromTitle = title => {
    const map={'Direito Constitucional':'constitucional','Direito Administrativo':'administrativo','Formação Humanística':'humanistica','Direitos Humanos':'direitos-humanos','Processo Civil':'processo-civil','Direito Civil':'civil','Direito Empresarial':'empresarial','Direito Penal':'penal'};
    return map[title] || '';
  };

  const defaultState = () => ({
    version:1,
    settings:{examDate:DATA.exam.date,sessionMinutes:50,targetScore:62,maxDailyBlocks:2,flashNewPerDay:12},
    cycle:{number:1,completed:[],history:[]},
    syllabus:{}, laws:{}, questions:{}, sessions:[], activeTimer:null, simulations:[],
    notes:{jurisprudence:[]}, flashcards:{reviews:{}},
  });

  let state = defaultState();
  let page = 'today';
  let meta = {authenticated:true,persistence:'local'};
  let saveTimer = null;
  let clockInterval = null;
  let timerModalOpen = false;
  let mobileSidebarOpen = false;
  let flashSubject = 'all';
  let flashKind = 'all';

  function mergeState(input){
    const base=defaultState();
    if(!input || typeof input!=='object') return base;
    return {...base,...input,settings:{...base.settings,...input.settings},cycle:{...base.cycle,...input.cycle},syllabus:input.syllabus||{},laws:input.laws||{},questions:input.questions||{},sessions:Array.isArray(input.sessions)?input.sessions:[],simulations:Array.isArray(input.simulations)?input.simulations:[],notes:{...base.notes,...input.notes},flashcards:{...base.flashcards,...(input.flashcards||{}),reviews:{...(base.flashcards.reviews||{}),...((input.flashcards||{}).reviews||{})}}};
  }

  async function api(path, options={}){
    const res=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
    if(!res.ok){const err=new Error(`HTTP ${res.status}`); err.status=res.status; throw err;} return res.json();
  }

  async function boot(){
    try{meta=await api('/api/enam/meta');}
    catch{meta={authenticated:true,persistence:'local',authRequired:false};}
    if(meta.authRequired && !meta.authenticated){showLogin();return;}
    await loadState(); showApp(); initEvents(); render(); startClock();
  }

  async function loadState(){
    if(meta.persistence==='database' || meta.persistence==='file'){
      try{state=mergeState(await api('/api/enam/state')); return;}catch(e){if(e.status===401){showLogin();return;}}
    }
    try{state=mergeState(JSON.parse(localStorage.getItem('enam_portal_state_v1')||'null'));}catch{state=defaultState();}
  }

  function saveState(){
    $('#saveStatus').textContent='salvando…';
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      try{
        if(meta.persistence==='database' || meta.persistence==='file') await api('/api/enam/state',{method:'PUT',body:JSON.stringify(state)});
        else localStorage.setItem('enam_portal_state_v1',JSON.stringify(state));
        $('#saveStatus').textContent='salvo';
      }catch{$('#saveStatus').textContent='erro ao salvar';}
    },400);
  }

  function showLogin(){ $('#loginScreen').classList.remove('hidden'); $('#app').classList.add('hidden'); }
  function showApp(){ $('#loginScreen').classList.add('hidden'); $('#app').classList.remove('hidden'); }

  function initEvents(){
    $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;go(b.dataset.page);});
    $('.sidebar-bottom').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page);});
    $('#mobileMenu').onclick=()=>$('.portal-nav-wrap').classList.toggle('open');
    $('#timerPill').onclick=()=>openTimerModal();
    $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/enam/login',{method:'POST',body:JSON.stringify({password:$('#loginPassword').value})});location.reload();}catch{$('#loginError').textContent='Senha incorreta.';}};
  }

  function go(p){page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('.portal-nav-wrap').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
  const titles={today:'Hoje',cycle:'Ciclo de estudos',syllabus:'Conteúdo do edital',questions:'Questões FGV',laws:'Lei seca',flashcards:'Anki',review:'Revisão',performance:'Desempenho',settings:'Ajustes'};

  function render(){
    $('#pageTitle').textContent=titles[page]||'ENAM';
    const map={today:renderToday,cycle:renderCycle,syllabus:renderSyllabus,questions:renderQuestions,laws:renderLaws,flashcards:renderFlashcards,review:renderReview,performance:renderPerformance,settings:renderSettings};
    $('#main').innerHTML=`<div class="page">${map[page]()}</div>`;
    bindPageEvents(); updateTopbar();
  }

  function updateTopbar(){
    const exam=new Date(`${state.settings.examDate}T13:00:00-03:00`); const now=new Date(); const days=Math.max(0,Math.ceil((exam-now)/86400000));
    $('#countdown').textContent=`${days} dias para a prova`;
    const active=state.activeTimer;
    $('#timerPill').classList.toggle('hidden',!active);
    if(active){$('#timerPillSubject').textContent=active.subject||active.title||'Foco';updateClockText();}
  }

  function phase(){
    const now=new Date(), exam=new Date(`${state.settings.examDate}T13:00:00-03:00`), days=(exam-now)/86400000;
    if(days<=14) return {id:'reta-final',name:'Reta final',desc:'Simulados completos, caderno de erros, lei seca e reparos cirúrgicos.',recipe:[['10','revisão'],['35','questões'],['5','erros']]};
    if(days<=30) return {id:'questoes',name:'Questões em primeiro plano',desc:'Menos aquisição e mais aplicação, jurisprudência e correção de erro.',recipe:[['10','conteúdo'],['35','questões'],['5','erros']]};
    if(days<=60) return {id:'consolidacao',name:'Consolidação',desc:'Conteúdo dirigido e volume crescente de questões.',recipe:[['20','conteúdo'],['25','questões'],['5','registro']]};
    return {id:'base',name:'Construção de base',desc:'Aquisição dirigida sem abandonar questões desde o primeiro ciclo.',recipe:[['30','conteúdo'],['15','questões'],['5','registro']]};
  }

  function cycleStatus(){

  function flashTodayStats(){

  function flashCardMatches(c){

  }
  function flashDueCards(){
    const today=localDateKey();
    return FLASHCARDS.filter(flashCardMatches).filter(c=>{
      const r=flashReview(c.id);
      return r && r.nextReviewDay && r.nextReviewDay<=today;
    }).sort((a,b)=>(flashReview(a.id)?.nextReviewDay||'').localeCompare(flashReview(b.id)?.nextReviewDay||''));
  }
  function flashUnseenCards(){
    return FLASHCARDS.filter(flashCardMatches).filter(c=>!flashReview(c.id));
  }
  function flashNewDoneToday(){

  function flashNewAllowance(){

  function flashDailyQueue(){

  }
  function flashDueCount(){return flashDueCards().length;}
  function flashNewAvailableCount(){return Math.min(flashUnseenCards().length,flashNewAllowance());}
  function flashSeenCount(){return Object.keys(state.flashcards?.reviews||{}).length;}
  function flashIntervalFor(stage,rating){
    const good=[1,3,7,14,30,60,90];
    if(rating==='again') return 1;
    if(rating==='hard') return Math.max(1,Math.round((good[Math.min(stage,good.length-1)]||30)*.6));
    if(rating==='easy') return good[Math.min(stage+2,good.length-1)]||90;
    return good[Math.min(stage+1,good.length-1)]||60;
  }
  function rateFlashcard(id,rating){
    const cur=flashReview(id)||{};
    const key=localDateKey();
    let stage=Number(cur.stage||0);
    if(rating==='again') stage=0;
    else if(rating==='hard') stage=Math.max(0,stage);
    else if(rating==='good') stage+=1;
    else if(rating==='easy') stage+=2;
    const interval=flashIntervalFor(Number(cur.stage||0),rating);
    const next=new Date(); next.setDate(next.getDate()+interval);
    state.flashcards=state.flashcards||{reviews:{}};
    state.flashcards.reviews=state.flashcards.reviews||{};
    state.flashcards.reviews[id]={
      ...cur,
      stage,
      reviews:Number(cur.reviews||0)+1,
      firstReviewedDay:cur.firstReviewedDay||key,
      lastReviewedAt:iso(),
      lastReviewedDay:key,
      lastRating:rating,
      nextReviewDay:localDateKey(next)
    };
    saveState(); render();
  }
