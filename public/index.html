<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5f2">
  <title>Linha do Dia</title>

  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --surface-soft: #efeeea;
      --text: #232321;
      --muted: #777570;
      --border: #dedcd6;
      --border-strong: #c9c6bf;
      --button: #292927;
      --button-text: #ffffff;
      --danger: #9f4d4d;
      --shadow: 0 12px 36px rgba(30, 30, 28, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .page {
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
      padding: 42px 0 80px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 42px;
    }

    .date {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .day-total {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 56px;
      align-items: start;
    }

    .focus-panel,
    .timeline-panel {
      min-width: 0;
    }

    .timeline-panel {
      border-left: 1px solid var(--border);
      padding-left: 42px;
    }

    .timer {
      margin: 0 0 34px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(48px, 7vw, 78px);
      font-weight: 520;
      line-height: 1;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
    }

    .field-label,
    .section-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 650;
    }

    textarea,
    .subtask-input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus,
    .subtask-input:focus {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 3px rgba(35, 35, 33, 0.06);
    }

    textarea {
      min-height: 112px;
      resize: vertical;
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 16px;
      line-height: 1.55;
    }

    textarea:disabled {
      background: var(--surface-soft);
      color: var(--muted);
    }

    .helper {
      min-height: 22px;
      padding-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 8px;
    }

    .button {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      padding: 0 17px;
      font-weight: 620;
    }

    .button-primary {
      border-color: var(--button);
      background: var(--button);
      color: var(--button-text);
    }

    .button-subtle {
      background: transparent;
    }

    .active-card {
      display: none;
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .active-card.visible {
      display: block;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .active-title {
      margin-top: 6px;
      font-size: 19px;
      font-weight: 650;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .active-time {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .subtasks {
      margin-top: 28px;
    }

    .subtasks-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 11px;
    }

    .subtasks-head .section-label {
      margin: 0;
    }

    .progress {
      color: var(--muted);
      font-size: 12px;
    }

    .subtask-form {
      display: flex;
      gap: 8px;
    }

    .subtask-input {
      min-width: 0;
      flex: 1;
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 16px;
    }

    .subtask-list,
    .timeline,
    .timeline-subtasks {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .subtask-list {
      margin-top: 8px;
    }

    .subtask-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 34px;
      gap: 8px;
      align-items: start;
      padding: 8px 0;
    }

    .subtask-row input[type="checkbox"] {
      width: 17px;
      height: 17px;
      margin: 2px 0 0;
      accent-color: var(--button);
    }

    .subtask-text {
      min-width: 0;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .subtask-row.done .subtask-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .remove-subtask {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
    }

    .timeline-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .timeline-header h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .summary {
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 26px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .timeline {
      position: relative;
      padding-left: 26px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 7px;
      bottom: 0;
      left: 4px;
      width: 1px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      padding: 0 0 34px;
    }

    .timeline-dot {
      position: absolute;
      top: 6px;
      left: -26px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text);
    }

    .timeline-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 9px 12px;
    }

    .timeline-clock {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .timeline-duration {
      color: var(--muted);
      font-size: 12px;
    }

    .timeline-title {
      margin-top: 7px;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .timeline-subtasks {
      margin-top: 12px;
    }

    .timeline-subtask {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 7px;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .timeline-subtask.done {
      color: var(--muted);
    }

    .timeline-subtask.done .timeline-subtask-text {
      text-decoration: line-through;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .clear-day {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 0;
      font-size: 12px;
    }

    .clear-day:hover {
      color: var(--danger);
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 28px, 660px);
        padding-top: 28px;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
        margin-bottom: 34px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 48px;
      }

      .timeline-panel {
        border-top: 1px solid var(--border);
        border-left: 0;
        padding-top: 32px;
        padding-left: 0;
      }

      .timer {
        letter-spacing: -0.055em;
      }
    }

    @media (max-width: 480px) {
      .page {
        width: calc(100% - 22px);
      }

      .subtask-form {
        flex-direction: column;
      }

      .subtask-form .button {
        width: 100%;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .actions .button-primary {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div>
        <div class="date" id="dateLabel"></div>
        <h1>Linha do Dia</h1>
      </div>
      <div class="day-total" id="dayTotal">0 min registrados hoje</div>
    </header>

    <div class="layout">
      <section class="focus-panel" aria-label="Cronômetro">
        <div class="timer" id="timer" aria-live="polite">00:00:00</div>

        <form id="activityForm">
          <label class="field-label" for="activity">O que você está fazendo?</label>
          <textarea
            id="activity"
            maxlength="500"
            placeholder="Ex.: Revisando a petição inicial"
          ></textarea>

          <div class="helper" id="activityMessage" aria-live="polite"></div>

          <div class="actions">
            <button class="button button-primary" id="startButton" type="submit">
              Iniciar
            </button>

            <button class="button" id="pauseButton" type="button" disabled>
              Pausar
            </button>

            <button class="button" id="finishButton" type="button" disabled>
              Concluir
            </button>
          </div>
        </form>

        <section class="active-card" id="activeCard">
          <div class="eyebrow">Em andamento</div>
          <div class="active-title" id="activeTitle"></div>
          <div class="active-time" id="activeTime"></div>

          <div class="subtasks">
            <div class="subtasks-head">
              <span class="section-label">Subatividades</span>
              <span class="progress" id="subtaskProgress">0/0</span>
            </div>

            <form class="subtask-form" id="subtaskForm">
              <input
                class="subtask-input"
                id="subtaskInput"
                type="text"
                maxlength="180"
                autocomplete="off"
                placeholder="Adicionar item ao checklist"
              >
              <button class="button button-subtle" type="submit">Adicionar</button>
            </form>

            <div class="helper" id="subtaskMessage" aria-live="polite"></div>
            <ul class="subtask-list" id="subtaskList"></ul>
          </div>
        </section>
      </section>

      <section class="timeline-panel" aria-label="Linha do tempo do dia">
        <div class="timeline-header">
          <h2>Hoje</h2>
          <span class="summary" id="summary">Nenhum registro</span>
        </div>

        <div class="empty" id="emptyState">
          Conforme você conclui cada bloco, ele aparece aqui com o horário,
          o tempo gasto e o checklist.
        </div>

        <ol class="timeline" id="timeline"></ol>

        <div class="footer-actions">
          <button class="clear-day" id="clearDayButton" type="button">
            Limpar registros de hoje
          </button>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "linha-do-dia:v1";

      const $ = (selector) => document.querySelector(selector);

      const timerEl = $("#timer");
      const dateLabel = $("#dateLabel");
      const dayTotal = $("#dayTotal");
      const activityForm = $("#activityForm");
      const activityInput = $("#activity");
      const activityMessage = $("#activityMessage");
      const startButton = $("#startButton");
      const pauseButton = $("#pauseButton");
      const finishButton = $("#finishButton");
      const activeCard = $("#activeCard");
      const activeTitle = $("#activeTitle");
      const activeTime = $("#activeTime");
      const subtaskForm = $("#subtaskForm");
      const subtaskInput = $("#subtaskInput");
      const subtaskMessage = $("#subtaskMessage");
      const subtaskProgress = $("#subtaskProgress");
      const subtaskList = $("#subtaskList");
      const summary = $("#summary");
      const emptyState = $("#emptyState");
      const timeline = $("#timeline");
      const clearDayButton = $("#clearDayButton");

      let timerInterval = null;

      const defaultState = () => ({
        entriesByDate: {},
        active: null
      });

      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();

          const parsed = JSON.parse(raw);
          return {
            entriesByDate: parsed.entriesByDate || {},
            active: parsed.active || null
          };
        } catch {
          return defaultState();
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function dateKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseDate(value) {
        return value ? new Date(value) : null;
      }

      function formatClock(date) {
        return new Intl.DateTimeFormat("pt-BR", {
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function formatTimer(milliseconds) {
        const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return [hours, minutes, seconds]
          .map((value) => String(value).padStart(2, "0"))
          .join(":");
      }

      function formatDuration(milliseconds) {
        const totalSeconds = Math.max(1, Math.floor(milliseconds / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);

        if (hours > 0) {
          return `${hours}h ${String(minutes).padStart(2, "0")}min`;
        }

        if (minutes > 0) {
          return `${minutes} min`;
        }

        return `${totalSeconds} s`;
      }

      function formatTotal(milliseconds) {
        const totalMinutes = Math.floor(milliseconds / 60000);

        if (totalMinutes < 60) {
          return `${totalMinutes} min`;
        }

        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        return minutes > 0 ? `${hours}h ${minutes}min` : `${hours}h`;
      }

      function currentElapsed() {
        if (!state.active) return 0;

        const accumulated = Number(state.active.accumulatedMs) || 0;

        if (state.active.paused || !state.active.lastStartedAt) {
          return accumulated;
        }

        return accumulated + Math.max(
          0,
          Date.now() - new Date(state.active.lastStartedAt).getTime()
        );
      }

      function startTicking() {
        stopTicking();
        timerInterval = setInterval(renderTimer, 250);
        renderTimer();
      }

      function stopTicking() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function renderTimer() {
        timerEl.textContent = formatTimer(currentElapsed());
      }

      function setControls() {
        const running = Boolean(state.active);

        activityInput.disabled = running;
        startButton.disabled = running;
        pauseButton.disabled = !running;
        finishButton.disabled = !running;

        if (!running) {
          pauseButton.textContent = "Pausar";
          return;
        }

        pauseButton.textContent = state.active.paused ? "Continuar" : "Pausar";
      }

      function renderActive() {
        if (!state.active) {
          activeCard.classList.remove("visible");
          activityInput.value = "";
          renderSubtasks();
          return;
        }

        activeCard.classList.add("visible");
        activityInput.value = state.active.title;
        activeTitle.textContent = state.active.title;

        const startedAt = parseDate(state.active.startedAt);
        activeTime.textContent = state.active.paused
          ? `Iniciado às ${formatClock(startedAt)} · pausado`
          : `Iniciado às ${formatClock(startedAt)}`;

        renderSubtasks();
      }

      function renderSubtasks() {
        subtaskList.innerHTML = "";

        const subtasks = state.active?.subtasks || [];
        const done = subtasks.filter((item) => item.done).length;

        subtaskProgress.textContent = `${done}/${subtasks.length}`;

        subtasks.forEach((item) => {
          const row = document.createElement("li");
          row.className = `subtask-row${item.done ? " done" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = item.done;
          checkbox.setAttribute("aria-label", `Marcar ${item.text}`);

          checkbox.addEventListener("change", () => {
            item.done = checkbox.checked;
            saveState();
            renderSubtasks();
          });

          const text = document.createElement("span");
          text.className = "subtask-text";
          text.textContent = item.text;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove-subtask";
          remove.title = "Remover";
          remove.setAttribute("aria-label", `Remover ${item.text}`);
          remove.textContent = "×";

          remove.addEventListener("click", () => {
            if (!state.active) return;

            state.active.subtasks = state.active.subtasks.filter(
              (candidate) => candidate.id !== item.id
            );

            saveState();
            renderSubtasks();
          });

          row.append(checkbox, text, remove);
          subtaskList.appendChild(row);
        });
      }

      function todayEntries() {
        return state.entriesByDate[dateKey()] || [];
      }

      function renderTimeline() {
        const entries = todayEntries();
        timeline.innerHTML = "";

        if (entries.length === 0) {
          emptyState.style.display = "block";
          summary.textContent = "Nenhum registro";
          dayTotal.textContent = "0 min registrados hoje";
          clearDayButton.style.display = "none";
          return;
        }

        emptyState.style.display = "none";
        clearDayButton.style.display = "inline-block";

        let total = 0;

        entries
          .slice()
          .sort((a, b) => new Date(b.start) - new Date(a.start))
          .forEach((entry) => {
            total += entry.durationMs;

            const item = document.createElement("li");
            item.className = "timeline-item";

            const dot = document.createElement("span");
            dot.className = "timeline-dot";

            const meta = document.createElement("div");
            meta.className = "timeline-meta";

            const clock = document.createElement("span");
            clock.className = "timeline-clock";
            clock.textContent = `${formatClock(parseDate(entry.start))} – ${formatClock(parseDate(entry.end))}`;

            const duration = document.createElement("span");
            duration.className = "timeline-duration";
            duration.textContent = formatDuration(entry.durationMs);

            meta.append(clock, duration);

            const title = document.createElement("div");
            title.className = "timeline-title";
            title.textContent = entry.title;

            item.append(dot, meta, title);

            if (entry.subtasks?.length) {
              const list = document.createElement("ul");
              list.className = "timeline-subtasks";

              entry.subtasks.forEach((subtask) => {
                const row = document.createElement("li");
                row.className = `timeline-subtask${subtask.done ? " done" : ""}`;

                const mark = document.createElement("span");
                mark.textContent = subtask.done ? "✓" : "○";

                const text = document.createElement("span");
                text.className = "timeline-subtask-text";
                text.textContent = subtask.text;

                row.append(mark, text);
                list.appendChild(row);
              });

              item.appendChild(list);
            }

            timeline.appendChild(item);
          });

        summary.textContent = `${entries.length} ${entries.length === 1 ? "registro" : "registros"} · ${formatTotal(total)}`;
        dayTotal.textContent = `${formatTotal(total)} registrados hoje`;
      }

      function renderAll() {
        dateLabel.textContent = new Intl.DateTimeFormat("pt-BR", {
          weekday: "long",
          day: "2-digit",
          month: "long"
        })
          .format(new Date())
          .replace(/^./, (letter) => letter.toUpperCase());

        renderTimer();
        renderActive();
        renderTimeline();
        setControls();

        if (state.active && !state.active.paused) {
          startTicking();
        } else {
          stopTicking();
        }
      }

      activityForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const title = activityInput.value.trim();

        if (!title) {
          activityMessage.textContent = "Escreva o que você está fazendo.";
          activityInput.focus();
          return;
        }

        const now = new Date();

        state.active = {
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          title,
          startedAt: now.toISOString(),
          lastStartedAt: now.toISOString(),
          accumulatedMs: 0,
          paused: false,
          subtasks: []
        };

        activityMessage.textContent = "";
        saveState();
        renderAll();
        subtaskInput.focus();
      });

      pauseButton.addEventListener("click", () => {
        if (!state.active) return;

        if (state.active.paused) {
          state.active.paused = false;
          state.active.lastStartedAt = new Date().toISOString();
        } else {
          state.active.accumulatedMs = currentElapsed();
          state.active.paused = true;
          state.active.lastStartedAt = null;
        }

        saveState();
        renderAll();
      });

      finishButton.addEventListener("click", () => {
        if (!state.active) return;

        const end = new Date();
        const durationMs = Math.max(1000, currentElapsed());
        const start = parseDate(state.active.startedAt);
        const key = dateKey(start);

        if (!state.entriesByDate[key]) {
          state.entriesByDate[key] = [];
        }

        state.entriesByDate[key].push({
          id: state.active.id,
          title: state.active.title,
          start: state.active.startedAt,
          end: end.toISOString(),
          durationMs,
          subtasks: (state.active.subtasks || []).map((item) => ({
            text: item.text,
            done: Boolean(item.done)
          }))
        });

        state.active = null;
        saveState();
        renderAll();
        activityInput.focus();
      });

      subtaskForm.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!state.active) return;

        const text = subtaskInput.value.trim();

        if (!text) {
          subtaskMessage.textContent = "Digite uma subatividade.";
          return;
        }

        state.active.subtasks.push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          text,
          done: false
        });

        subtaskInput.value = "";
        subtaskMessage.textContent = "";
        saveState();
        renderSubtasks();
        subtaskInput.focus();
      });

      clearDayButton.addEventListener("click", () => {
        const entries = todayEntries();

        if (!entries.length) return;

        const confirmed = window.confirm(
          "Apagar todos os registros de hoje? Essa ação não pode ser desfeita."
        );

        if (!confirmed) return;

        delete state.entriesByDate[dateKey()];
        saveState();
        renderTimeline();
      });

      window.addEventListener("beforeunload", () => {
        if (state.active && !state.active.paused) {
          state.active.accumulatedMs = currentElapsed();
          state.active.lastStartedAt = new Date().toISOString();
          saveState();
        }
      });

      renderAll();
    })();
  </script>
</body>
</html>
