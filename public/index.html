<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Linha do Dia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --surface: #090909;
      --surface-soft: #0d0d0d;
      --text: #d7d7d7;
      --text-strong: #eeeeee;
      --muted: #777777;
      --muted-dark: #4f4f4f;
      --border: #1c1c1c;
      --border-strong: #353535;
      --button: #d6d6d6;
      --button-text: #080808;
      --danger: #a66a6a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: "Nunito", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.28;
    }

    ::selection {
      background: #d7d7d7;
      color: #050505;
    }

    .page {
      width: min(1240px, calc(100% - 56px));
      margin: 0 auto;
      padding: 52px 0 92px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 56px;
    }

    .date {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text-strong);
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .day-total {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .status {
      display: none;
      margin-bottom: 28px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: #9d9d9d;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.visible {
      display: block;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 70px;
      align-items: start;
    }

    .focus-panel,
    .timeline-panel {
      min-width: 0;
    }

    .timeline-panel {
      border-left: 1px solid var(--border);
      padding-left: 50px;
    }

    .timer {
      margin: 0 0 48px;
      color: var(--text-strong);
      font-family: "Nunito", ui-sans-serif, sans-serif;
      font-size: clamp(58px, 8vw, 94px);
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
    }

    .field-group + .field-group {
      margin-top: 24px;
    }

    .field-label,
    .section-label {
      display: block;
      margin-bottom: 10px;
      color: #a6a6a6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field-hint {
      margin-left: 5px;
      color: var(--muted-dark);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: none;
    }

    textarea,
    .subtask-input {
      width: 100%;
      border: 1px solid var(--border);
      background: #080808;
      color: var(--text);
      outline: none;
      caret-color: var(--text-strong);
      transition:
        border-color 0.16s ease,
        background 0.16s ease;
    }

    textarea::placeholder,
    .subtask-input::placeholder {
      color: #414141;
    }

    textarea:focus,
    .subtask-input:focus {
      border-color: var(--border-strong);
      background: #0b0b0b;
      box-shadow: none;
    }

    textarea {
      resize: vertical;
      border-radius: 8px;
      padding: 15px 16px;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.6;
    }

    .description-input {
      min-height: 90px;
    }

    .notes-input {
      min-height: 122px;
    }

    textarea:disabled {
      border-color: #141414;
      background: #070707;
      color: #5f5f5f;
    }

    .helper {
      min-height: 22px;
      padding-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }

    .button {
      min-height: 42px;
      border: 1px solid #2c2c2c;
      border-radius: 7px;
      background: transparent;
      color: #a9a9a9;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
    }

    .button:hover:not(:disabled) {
      border-color: #494949;
      background: #101010;
      color: var(--text-strong);
    }

    .button-primary {
      border-color: var(--button);
      background: var(--button);
      color: var(--button-text);
    }

    .button-primary:hover:not(:disabled) {
      border-color: #eeeeee;
      background: #eeeeee;
      color: #050505;
    }

    .button-subtle {
      background: transparent;
    }

    .active-card {
      display: none;
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .active-card.visible {
      display: block;
    }

    .eyebrow {
      color: #545454;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .active-title {
      margin-top: 7px;
      color: var(--text-strong);
      font-size: 20px;
      font-weight: 650;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .active-time {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .active-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .active-actions .button {
      min-width: 96px;
    }

    .focus-panel.is-running #activityForm {
      display: none;
    }

    .focus-panel.is-running .active-card {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .active-notes {
      margin-top: 30px;
    }

    .save-state {
      min-height: 18px;
      margin-top: 6px;
      color: #555555;
      font-size: 11px;
    }

    .subtasks {
      margin-top: 30px;
    }

    .subtasks-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 11px;
    }

    .subtasks-head .section-label {
      margin: 0;
    }

    .progress {
      color: #555555;
      font-size: 11px;
      font-weight: 600;
    }

    .subtask-form {
      display: flex;
      gap: 8px;
    }

    .subtask-input {
      min-width: 0;
      flex: 1;
      border-radius: 7px;
      padding: 11px 12px;
      font-size: 14px;
    }

    .subtask-list,
    .timeline,
    .timeline-subtasks {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .subtask-list {
      margin-top: 10px;
    }

    .subtask-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 34px;
      gap: 8px;
      align-items: start;
      padding: 8px 0;
      border-bottom: 1px solid #101010;
    }

    .subtask-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 2px 0 0;
      accent-color: #bdbdbd;
    }

    .subtask-text {
      min-width: 0;
      color: #adadad;
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .subtask-row.done .subtask-text {
      color: #4e4e4e;
      text-decoration: line-through;
    }

    .remove-subtask {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #444444;
      font-size: 19px;
      line-height: 1;
    }

    .remove-subtask:hover {
      color: #9c9c9c;
    }

    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 34px;
    }

    .timeline-header-main {
      min-width: 0;
    }

    .day-heading {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .day-arrow {
      width: 20px;
      height: 24px;
      border: 0;
      background: transparent;
      color: #393939;
      padding: 0;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
      transition: color 0.15s ease;
    }

    .day-arrow:hover,
    .day-arrow:focus-visible {
      color: #a3a3a3;
      outline: none;
    }

    .day-arrow.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .planned-section {
      display: none;
      margin: 0 0 30px;
      padding: 0 0 24px;
      border-bottom: 1px solid #151515;
    }

    .planned-section.visible {
      display: block;
    }

    .planned-heading {
      margin-bottom: 14px;
      color: #4d4d4d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .planned-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .planned-item {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #101010;
    }

    .planned-item:last-child {
      border-bottom: 0;
    }

    .planned-marker {
      padding-top: 5px;
      color: #555555;
      font-size: 11px;
      line-height: 1;
    }

    .planned-main {
      min-width: 0;
    }

    .planned-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .planned-title {
      min-width: 0;
      flex: 1;
      color: #b9b9b9;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .planned-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 0 0 auto;
    }

    .plan-start,
    .plan-menu {
      width: 27px;
      height: 27px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #353535;
      padding: 0;
      line-height: 1;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .plan-start {
      font-size: 11px;
    }

    .plan-menu {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .plan-start:hover,
    .plan-menu:hover,
    .plan-start:focus-visible,
    .plan-menu:focus-visible {
      background: #0d0d0d;
      color: #888888;
      outline: none;
    }

    .plan-notes {
      display: none;
      margin-top: 7px;
      padding-left: 10px;
      border-left: 1px solid #292929;
      color: #737373;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .plan-notes.visible {
      display: block;
    }

    .plan-notes-toggle {
      min-height: 27px;
      margin-top: 5px;
      border: 0;
      background: transparent;
      color: #505050;
      padding: 0;
      font-size: 10px;
      font-weight: 700;
    }

    .plan-editor {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #151515;
    }

    .plan-editor.visible {
      display: block;
    }

    .inline-delete {
      min-height: 34px;
      margin-left: auto;
      border: 0;
      background: transparent;
      color: #4b3c3c;
      padding: 0 4px;
      font-size: 10px;
      font-weight: 700;
    }

    .inline-reopen {
      min-height: 34px;
      border: 0;
      background: transparent;
      color: #646464;
      padding: 0 4px;
      font-size: 10px;
      font-weight: 700;
    }

    .inline-reopen:hover {
      color: #c3c3c3;
    }

    .inline-delete:hover {
      color: #a56e6e;
    }

    .timeline-header h2 {
      margin: 0;
      color: var(--text-strong);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .summary {
      display: block;
      margin-top: 5px;
      color: #5d5d5d;
      font-size: 11px;
      font-weight: 600;
    }

    .pdf-button {
      flex: 0 0 auto;
    }

    .empty {
      padding: 28px 0;
      border-top: 1px solid var(--border);
      color: #5d5d5d;
      font-size: 13px;
      line-height: 1.7;
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 7px;
      bottom: 0;
      left: 4px;
      width: 1px;
      background: #202020;
    }

    .timeline-item {
      position: relative;
      padding: 0 0 40px;
    }

    .timeline-dot {
      position: absolute;
      top: 6px;
      left: -28px;
      width: 9px;
      height: 9px;
      border: 2px solid #8b8b8b;
      border-radius: 50%;
      background: var(--bg);
    }

    .timeline-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 9px 13px;
    }

    .timeline-clock {
      color: #b8b8b8;
      font-family: "Nunito", ui-sans-serif, sans-serif;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .timeline-duration {
      color: #505050;
      font-size: 11px;
      font-weight: 600;
    }

    .timeline-title {
      margin-top: 7px;
      color: var(--text);
      font-size: 16px;
      font-weight: 650;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .timeline-subtasks {
      margin-top: 13px;
    }

    .timeline-subtask {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 7px;
      margin-bottom: 6px;
      color: #858585;
      font-size: 12px;
      line-height: 1.5;
    }

    .timeline-subtask.done {
      color: #484848;
    }

    .timeline-subtask.done .timeline-subtask-text {
      text-decoration: line-through;
    }

    .notes-toggle {
      margin-top: 12px;
      min-height: 32px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #606060;
      padding: 3px 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .notes-toggle:hover {
      color: #a7a7a7;
    }

    .timeline-notes {
      display: none;
      margin-top: 7px;
      padding: 11px 0 11px 13px;
      border-left: 1px solid #333333;
      color: #818181;
      font-size: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .timeline-notes.visible {
      display: block;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .clear-day {
      border: 0;
      background: transparent;
      color: #3f3f3f;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
    }

    .clear-day:hover {
      color: var(--danger);
    }


    .timeline-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .timeline-title-row .timeline-title {
      min-width: 0;
      flex: 1;
    }

    .entry-menu {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      margin-top: 2px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #343434;
      padding: 0;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .entry-menu:hover,
    .entry-menu:focus-visible {
      background: #0d0d0d;
      color: #888888;
      outline: none;
    }

    .timeline-tools {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .manual-toggle {
      width: 34px;
      min-width: 34px;
      height: 34px;
      min-height: 34px;
      border-color: #202020;
      padding: 0;
      color: #5b5b5b;
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
    }

    .manual-toggle:hover:not(:disabled) {
      color: #c5c5c5;
    }

    .inline-panel {
      display: none;
      margin: -8px 0 30px;
      padding: 18px 0 22px;
      border-top: 1px solid #161616;
      border-bottom: 1px solid #161616;
    }

    .inline-panel.visible {
      display: block;
    }

    .inline-panel-title {
      margin-bottom: 16px;
      color: #8d8d8d;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .inline-field {
      min-width: 0;
    }

    .inline-field.full {
      grid-column: 1 / -1;
    }

    .inline-label {
      display: block;
      margin-bottom: 7px;
      color: #646464;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .inline-input,
    .inline-textarea {
      width: 100%;
      border: 1px solid #1d1d1d;
      border-radius: 7px;
      background: #080808;
      color: #c7c7c7;
      outline: none;
      padding: 10px 11px;
      font: inherit;
      font-size: 13px;
    }

    .inline-input:focus,
    .inline-textarea:focus {
      border-color: #383838;
    }

    .inline-textarea {
      min-height: 78px;
      resize: vertical;
      line-height: 1.55;
    }

    .inline-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .inline-save,
    .inline-cancel {
      min-height: 34px;
      border-radius: 6px;
      padding: 0 11px;
      font-size: 11px;
      font-weight: 700;
    }

    .inline-save {
      border: 1px solid #585858;
      background: #d0d0d0;
      color: #080808;
    }

    .inline-cancel {
      border: 1px solid #202020;
      background: transparent;
      color: #666666;
    }

    .inline-error {
      min-height: 17px;
      margin-top: 8px;
      color: #9a6666;
      font-size: 11px;
    }

    .entry-editor {
      display: none;
      margin-top: 17px;
      padding: 16px 0 2px;
      border-top: 1px solid #151515;
    }

    .entry-editor.visible {
      display: block;
    }

    @media (max-width: 520px) {
      .inline-grid {
        grid-template-columns: 1fr;
      }

      .inline-field.full {
        grid-column: auto;
      }

      .timeline-tools {
        width: 100%;
      }

      .timeline-tools .pdf-button {
        flex: 1;
        width: auto;
      }
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 30px, 660px);
        padding-top: 32px;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
        margin-bottom: 44px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 54px;
      }

      .timeline-panel {
        border-top: 1px solid var(--border);
        border-left: 0;
        padding-top: 38px;
        padding-left: 0;
      }

      .timer {
        font-size: clamp(56px, 16vw, 82px);
      }
    }

    @media (max-width: 520px) {
      .page {
        width: calc(100% - 24px);
      }

      .timeline-header {
        align-items: stretch;
        flex-direction: column;
      }

      .pdf-button {
        width: 100%;
      }

      .subtask-form {
        flex-direction: column;
      }

      .subtask-form .button {
        width: 100%;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .actions .button-primary {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div>
        <div class="date" id="dateLabel"></div>
        <h1>Linha do Dia</h1>
      </div>

      <div class="day-total" id="dayTotal">
        Carregando...
      </div>
    </header>

    <div class="status" id="statusMessage" aria-live="polite"></div>

    <div class="layout">
      <section class="focus-panel" aria-label="Cronômetro">

        <form id="activityForm">

            <div class="save-state" id="notesSaveState"></div>

          <div class="subtasks">

            <form class="subtask-form" id="subtaskForm">
              <input

                id="subtaskInput"

                id="manualNotes"

        <form class="inline-panel" id="planForm">
          <div class="inline-panel-title">Planejar amanhã</div>

          <div class="inline-grid">
            <div class="inline-field full">
              <label class="inline-label" for="planTitle">Descrição</label>
              <input
                class="inline-input"
                id="planTitle"
                type="text"
                maxlength="500"
                autocomplete="off"
                placeholder="O que você quer fazer amanhã?"
              >
            </div>

            <div class="inline-field full">
              <label class="inline-label" for="planNotes">Anotações</label>
              <textarea
                class="inline-textarea"
                id="planNotes"
                maxlength="12000"
                placeholder="Opcional"
              ></textarea>
            </div>
          </div>

          <div class="inline-error" id="planError" aria-live="polite"></div>

          <div class="inline-actions">
            <button class="inline-save" type="submit">Salvar</button>
            <button class="inline-cancel" id="planCancelButton" type="button">Cancelar</button>
          </div>

        <section class="planned-section" id="plannedSection">
          <div class="planned-heading">Planejado</div>
          <ul class="planned-list" id="plannedList"></ul>
        </section>

        <div class="empty" id="emptyState">
          Conforme você conclui cada bloco, ele aparece aqui em ordem cronológica,
          com o horário, o tempo gasto e o checklist.
        </div>

        <ol class="timeline" id="timeline"></ol>

        <div class="footer-actions">
          <button class="clear-day" id="clearDayButton" type="button">
            Limpar registros de hoje
          </button>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const $ = selector => document.querySelector(selector);

      const timerEl = $("#timer");
      const focusPanel = document.querySelector(".focus-panel");
      const dateLabel = $("#dateLabel");
      const dayTotal = $("#dayTotal");
      const statusMessage = $("#statusMessage");

      const activityForm = $("#activityForm");
      const activityDescription = $("#activityDescription");
      const activityNotes = $("#activityNotes");
      const activityMessage = $("#activityMessage");

      const startButton = $("#startButton");
      const pauseButton = $("#pauseButton");
      const finishButton = $("#finishButton");

      const activeCard = $("#activeCard");
      const activeTitle = $("#activeTitle");
      const activeTime = $("#activeTime");
      const activeNotes = $("#activeNotes");
      const notesSaveState = $("#notesSaveState");

      const subtaskForm = $("#subtaskForm");
      const subtaskInput = $("#subtaskInput");
      const subtaskMessage = $("#subtaskMessage");
      const subtaskProgress = $("#subtaskProgress");
      const subtaskList = $("#subtaskList");

      const summary = $("#summary");
      const emptyState = $("#emptyState");
      const timeline = $("#timeline");
      const clearDayButton = $("#clearDayButton");
      const exportPdfButton = $("#exportPdfButton");

      const manualToggleButton = $("#manualToggleButton");
      const manualForm = $("#manualForm");
      const manualTitle = $("#manualTitle");
      const manualStart = $("#manualStart");
      const manualEnd = $("#manualEnd");
      const manualNotes = $("#manualNotes");
      const manualError = $("#manualError");
      const manualCancelButton = $("#manualCancelButton");

      const dayHeadingLabel = $("#dayHeadingLabel");
      const prevDayButton = $("#prevDayButton");
      const nextDayButton = $("#nextDayButton");

      const planForm = $("#planForm");
      const planTitle = $("#planTitle");
      const planNotes = $("#planNotes");
      const planError = $("#planError");
      const planCancelButton = $("#planCancelButton");
      const plannedSection = $("#plannedSection");
      const plannedList = $("#plannedList");

      let active = null;
      let entries = [];
      let plans = [];
      let viewOffset = 0;
      let timerInterval = null;
      let busy = false;

      let notesSaveTimer = null;
      let notesSavePromise = null;
      let lastSavedNotes = "";

      function dateKeyFromOffset(offset = 0) {
        const date = new Date();
        date.setHours(12, 0, 0, 0);
        date.setDate(date.getDate() + offset);

        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");
      }

      function dayKey() {
        return dateKeyFromOffset(0);
      }

      function viewDayKey() {
        return dateKeyFromOffset(viewOffset);
      }

      function inputTime(value) {
        return new Intl.DateTimeFormat("pt-BR", {
          timeZone: "America/Sao_Paulo",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(new Date(value));
      }

      function formatClock(value) {
        return new Intl.DateTimeFormat("pt-BR", {
          timeZone: "America/Sao_Paulo",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(value));
      }

      function formatTimer(milliseconds) {
        const total = Math.max(0, Math.floor(milliseconds / 1000));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;

        return [hours, minutes, seconds]
          .map(value => String(value).padStart(2, "0"))
          .join(":");
      }

      function formatDuration(milliseconds) {
        const seconds = Math.max(1, Math.floor(milliseconds / 1000));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);

        if (hours) {
          return `${hours}h ${String(minutes).padStart(2, "0")}min`;
        }

        if (minutes) {
          return `${minutes} min`;
        }

        return `${seconds} s`;
      }

      function formatTotal(milliseconds) {
        const minutes = Math.floor(milliseconds / 60000);

        if (minutes < 60) {
          return `${minutes} min`;
        }

        const hours = Math.floor(minutes / 60);
        const remainder = minutes % 60;

        return remainder
          ? `${hours}h ${remainder}min`
          : `${hours}h`;
      }

      function elapsed() {
        if (!active) {
          return 0;
        }

        let value = Number(active.accumulatedMs || 0);

        if (active.status === "active" && active.lastStartedAt) {
          value += Math.max(
            0,
            Date.now() - new Date(active.lastStartedAt).getTime()
          );
        }

        return value;
      }

      function setStatus(message = "") {
        statusMessage.textContent = message;
        statusMessage.classList.toggle("visible", Boolean(message));
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
          },
          ...options
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.error || "Não foi possível concluir a operação."
          );
        }

        return data;
      }

      function setBusy(value) {
        busy = value;
        renderControls();
      }

      function formatTabTimer(milliseconds) {
        const total = Math.max(0, Math.floor(milliseconds / 1000));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;

        if (hours > 0) {
          return [hours, minutes, seconds]
            .map(value => String(value).padStart(2, "0"))
            .join(":");
        }

        return [minutes, seconds]
          .map(value => String(value).padStart(2, "0"))
          .join(":");
      }

      function renderBrowserTitle() {
        if (!active) {
          document.title = "Linha do Dia";
          return;
        }

        const time = formatTabTimer(elapsed());

        document.title =
          active.status === "paused"
            ? `⏸ ${time} · Linha do Dia`
            : `${time} · Linha do Dia`;
      }

      function renderTimer() {
        timerEl.textContent = formatTimer(elapsed());
        renderBrowserTitle();
      }

      function startTick() {
        stopTick();
        timerInterval = setInterval(renderTimer, 250);
        renderTimer();
      }

      function stopTick() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function renderControls() {
        const running = Boolean(active);

        activityDescription.disabled = running || busy;
        activityNotes.disabled = running || busy;
        startButton.disabled = running || busy;
        pauseButton.disabled = !running || busy;
        finishButton.disabled = !running || busy;
        manualToggleButton.disabled = busy;
        exportPdfButton.disabled = entries.length === 0 || busy;

        pauseButton.textContent =
          active?.status === "paused"
            ? "Continuar"
            : "Pausar";
      }

      function renderActive() {
        renderBrowserTitle();
        focusPanel.classList.toggle("is-running", Boolean(active));

        if (!active) {
          activeCard.classList.remove("visible");
          activityDescription.value = "";
          activityNotes.value = "";
          activeNotes.value = "";
          lastSavedNotes = "";
          notesSaveState.textContent = "";
          renderSubtasks();
          stopTick();
          renderTimer();
          return;
        }

        activeCard.classList.add("visible");
        activityDescription.value = active.title;
        activityNotes.value = active.notes || "";
        activeTitle.textContent = active.title;

        activeTime.textContent =
          `Iniciado às ${formatClock(active.startedAt)}` +
          (active.status === "paused" ? " · pausado" : "");

        if (document.activeElement !== activeNotes) {
          activeNotes.value = active.notes || "";
        }

        lastSavedNotes = active.notes || "";

        renderSubtasks();

        if (active.status === "active") {
          startTick();
        } else {
          stopTick();
          renderTimer();
        }
      }

      function renderSubtasks() {
        subtaskList.innerHTML = "";

        const subtasks = active?.subtasks || [];
        const done = subtasks.filter(item => item.done).length;

        subtaskProgress.textContent = `${done}/${subtasks.length}`;

        subtasks.forEach(item => {
          const row = document.createElement("li");
          row.className = `subtask-row${item.done ? " done" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = item.done;
          checkbox.setAttribute(
            "aria-label",
            `Marcar ${item.text}`
          );

          checkbox.addEventListener("change", async () => {
            const next = subtasks.map(candidate =>
              candidate.id === item.id
                ? { ...candidate, done: checkbox.checked }
                : candidate
            );

            await saveSubtasks(next);
          });

          const text = document.createElement("span");
          text.className = "subtask-text";
          text.textContent = item.text;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove-subtask";
          remove.textContent = "×";
          remove.title = "Remover";
          remove.setAttribute(
            "aria-label",
            `Remover ${item.text}`
          );

          remove.addEventListener("click", async () => {
            await saveSubtasks(
              subtasks.filter(candidate => candidate.id !== item.id)
            );
          });

          row.append(checkbox, text, remove);
          subtaskList.appendChild(row);
        });
      }

      function makeEntryEditor(entry, item, menuButton) {
        const editor = document.createElement("form");
        editor.className = "entry-editor";

        const grid = document.createElement("div");
        grid.className = "inline-grid";

        const descriptionField = document.createElement("div");
        descriptionField.className = "inline-field full";

        const descriptionLabel = document.createElement("label");
        descriptionLabel.className = "inline-label";
        descriptionLabel.textContent = "Descrição";

        const descriptionInput = document.createElement("input");
        descriptionInput.className = "inline-input";
        descriptionInput.type = "text";
        descriptionInput.maxLength = 500;
        descriptionInput.value = entry.title;

        descriptionField.append(descriptionLabel, descriptionInput);

        const startField = document.createElement("div");
        startField.className = "inline-field";

        const startLabel = document.createElement("label");
        startLabel.className = "inline-label";
        startLabel.textContent = "Início";

        const startInput = document.createElement("input");
        startInput.className = "inline-input";
        startInput.type = "time";
        startInput.value = inputTime(entry.startedAt);

        startField.append(startLabel, startInput);

        const endField = document.createElement("div");
        endField.className = "inline-field";

        const endLabel = document.createElement("label");
        endLabel.className = "inline-label";
        endLabel.textContent = "Fim";

        const endInput = document.createElement("input");
        endInput.className = "inline-input";
        endInput.type = "time";
        endInput.value = inputTime(entry.endedAt);

        endField.append(endLabel, endInput);

        const notesField = document.createElement("div");
        notesField.className = "inline-field full";

        const notesLabel = document.createElement("label");
        notesLabel.className = "inline-label";
        notesLabel.textContent = "Anotações";

        const notesInput = document.createElement("textarea");
        notesInput.className = "inline-textarea";
        notesInput.maxLength = 12000;
        notesInput.value = entry.notes || "";

        notesField.append(notesLabel, notesInput);

        grid.append(
          descriptionField,
          startField,
          endField,
          notesField
        );

        const error = document.createElement("div");
        error.className = "inline-error";

        const actions = document.createElement("div");
        actions.className = "inline-actions";

        const save = document.createElement("button");
        save.type = "submit";
        save.className = "inline-save";
        save.textContent = "Salvar";

        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "inline-cancel";
        cancel.textContent = "Cancelar";

        const reopen = document.createElement("button");
        reopen.type = "button";
        reopen.className = "inline-reopen";
        reopen.textContent = "Reabrir";

        reopen.addEventListener("click", async () => {
          reopen.disabled = true;
          save.disabled = true;
          cancel.disabled = true;
          error.textContent = "";

          try {
            const data = await api(
              `/api/entries/${encodeURIComponent(entry.id)}/reopen`,
              { method: "POST" }
            );

            active = data.active;
            await load();
          } catch (apiError) {
            error.textContent = apiError.message;
            reopen.disabled = false;
            save.disabled = false;
            cancel.disabled = false;
          }
        });

        cancel.addEventListener("click", () => {
          editor.classList.remove("visible");
          menuButton.setAttribute("aria-expanded", "false");
        });

        editor.addEventListener("submit", async event => {
          event.preventDefault();

          const title = descriptionInput.value.trim();
          const startTime = startInput.value;
          const endTime = endInput.value;

          if (!title || !startTime || !endTime) {
            error.textContent = "Preencha descrição, início e fim.";
            return;
          }

          error.textContent = "";
          save.disabled = true;
          cancel.disabled = true;

          try {
            await api(`/api/entries/${encodeURIComponent(entry.id)}`, {
              method: "PUT",
              body: JSON.stringify({
                title,
                notes: notesInput.value,
                day: viewDayKey(),
                startTime,
                endTime
              })
            });

            await load();
          } catch (apiError) {
            error.textContent = apiError.message;
            save.disabled = false;
            cancel.disabled = false;
          }
        });

        actions.append(save, cancel, reopen);
        editor.append(grid, error, actions);

        return editor;
      }

      function makePlanEditor(plan, menuButton) {
        const editor = document.createElement("form");
        editor.className = "plan-editor";

        const grid = document.createElement("div");
        grid.className = "inline-grid";

        const titleField = document.createElement("div");
        titleField.className = "inline-field full";

        const titleLabel = document.createElement("label");
        titleLabel.className = "inline-label";
        titleLabel.textContent = "Descrição";

        const titleInput = document.createElement("input");
        titleInput.className = "inline-input";
        titleInput.type = "text";
        titleInput.maxLength = 500;
        titleInput.value = plan.title;

        titleField.append(titleLabel, titleInput);

        const notesField = document.createElement("div");
        notesField.className = "inline-field full";

        const notesLabel = document.createElement("label");
        notesLabel.className = "inline-label";
        notesLabel.textContent = "Anotações";

        const notesInput = document.createElement("textarea");
        notesInput.className = "inline-textarea";
        notesInput.maxLength = 12000;
        notesInput.value = plan.notes || "";

        notesField.append(notesLabel, notesInput);
        grid.append(titleField, notesField);

        const error = document.createElement("div");
        error.className = "inline-error";

        const actions = document.createElement("div");
        actions.className = "inline-actions";

        const save = document.createElement("button");
        save.type = "submit";
        save.className = "inline-save";
        save.textContent = "Salvar";

        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "inline-cancel";
        cancel.textContent = "Cancelar";

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "inline-delete";
        remove.textContent = "Excluir";

        cancel.addEventListener("click", () => {
          editor.classList.remove("visible");
          menuButton.setAttribute("aria-expanded", "false");
        });

        remove.addEventListener("click", async () => {
          const confirmed = window.confirm(
            "Excluir esta atividade planejada?"
          );

          if (!confirmed) {
            return;
          }

          remove.disabled = true;

          try {
            await api(`/api/plans/${encodeURIComponent(plan.id)}`, {
              method: "DELETE"
            });

            await load();
          } catch (errorValue) {
            error.textContent = errorValue.message;
            remove.disabled = false;
          }
        });

        editor.addEventListener("submit", async event => {
          event.preventDefault();

          const title = titleInput.value.trim();

          if (!title) {
            error.textContent = "Informe a descrição.";
            return;
          }

          error.textContent = "";
          save.disabled = true;
          cancel.disabled = true;
          remove.disabled = true;

          try {
            await api(`/api/plans/${encodeURIComponent(plan.id)}`, {
              method: "PUT",
              body: JSON.stringify({
                title,
                notes: notesInput.value
              })
            });

            await load();
          } catch (errorValue) {
            error.textContent = errorValue.message;
            save.disabled = false;
            cancel.disabled = false;
            remove.disabled = false;
          }
        });

        actions.append(save, cancel, remove);
        editor.append(grid, error, actions);

        return editor;
      }

      function renderPlans() {
        plannedList.innerHTML = "";

        if (!plans.length) {
          plannedSection.classList.remove("visible");
          return;
        }

        plannedSection.classList.add("visible");

        plans.forEach(plan => {
          const item = document.createElement("li");
          item.className = "planned-item";

          const marker = document.createElement("span");
          marker.className = "planned-marker";
          marker.textContent = "○";

          const main = document.createElement("div");
          main.className = "planned-main";

          const titleRow = document.createElement("div");
          titleRow.className = "planned-title-row";

          const title = document.createElement("div");
          title.className = "planned-title";
          title.textContent = plan.title;

          const actions = document.createElement("div");
          actions.className = "planned-actions";

          if (viewOffset === 0) {
            const start = document.createElement("button");
            start.type = "button";
            start.className = "plan-start";
            start.textContent = "▶";
            start.title = "Iniciar";
            start.setAttribute("aria-label", `Iniciar ${plan.title}`);

            start.addEventListener("click", async () => {
              if (busy) {
                return;
              }

              setBusy(true);
              setStatus("");

              try {
                const data = await api(
                  `/api/plans/${encodeURIComponent(plan.id)}/start`,
                  { method: "POST" }
                );

                active = data.active;
                await load();
              } catch (errorValue) {
                setStatus(errorValue.message);
              } finally {
                setBusy(false);
              }
            });

            actions.appendChild(start);
          }

          const menu = document.createElement("button");
          menu.type = "button";
          menu.className = "plan-menu";
          menu.textContent = "···";
          menu.title = "Editar planejamento";
          menu.setAttribute("aria-label", "Editar planejamento");
          menu.setAttribute("aria-expanded", "false");

          actions.appendChild(menu);
          titleRow.append(title, actions);
          main.appendChild(titleRow);

          const notes = String(plan.notes || "").trim();

          if (notes) {
            const notesToggle = document.createElement("button");
            notesToggle.type = "button";
            notesToggle.className = "plan-notes-toggle";
            notesToggle.textContent = "Anotações";

            const notesBox = document.createElement("div");
            notesBox.className = "plan-notes";
            notesBox.textContent = notes;

            notesToggle.addEventListener("click", () => {
              const open = notesBox.classList.toggle("visible");
              notesToggle.textContent = open
                ? "Fechar anotações"
                : "Anotações";
            });

            main.append(notesToggle, notesBox);
          }

          const editor = makePlanEditor(plan, menu);

          menu.addEventListener("click", () => {
            const open = editor.classList.toggle("visible");
            menu.setAttribute("aria-expanded", String(open));

            if (open) {
              const input = editor.querySelector(".inline-input");
              if (input) input.focus();
            }
          });

          main.appendChild(editor);
          item.append(marker, main);
          plannedList.appendChild(item);
        });
      }

      function renderDayHeader() {
        const tomorrow = viewOffset === 1;

        dayHeadingLabel.textContent = tomorrow ? "Amanhã" : "Hoje";
        prevDayButton.classList.toggle("hidden", !tomorrow);
        nextDayButton.classList.toggle("hidden", tomorrow);

        manualToggleButton.title = tomorrow
          ? "Planejar atividade"
          : "Lançamento manual";

        manualToggleButton.setAttribute(
          "aria-label",
          tomorrow
            ? "Planejar atividade para amanhã"
            : "Novo lançamento manual"
        );

        exportPdfButton.style.display = tomorrow ? "none" : "";
      }

      function renderTimeline() {
        timeline.innerHTML = "";
        renderDayHeader();
        renderPlans();

        if (viewOffset === 1) {
          timeline.style.display = "none";
          clearDayButton.style.display = "none";
          exportPdfButton.disabled = true;

          if (!plans.length) {
            emptyState.style.display = "block";
            emptyState.textContent =
              "Nenhuma atividade planejada para amanhã.";
          } else {
            emptyState.style.display = "none";
          }

          summary.textContent =
            `${plans.length} ${plans.length === 1 ? "atividade planejada" : "atividades planejadas"}`;

          dayTotal.textContent =
            `${plans.length} ${plans.length === 1 ? "atividade planejada" : "atividades planejadas"} para amanhã`;

          return;
        }

        timeline.style.display = "";

        if (!entries.length) {
          emptyState.style.display = plans.length ? "none" : "block";
          emptyState.textContent =
            "Conforme você conclui cada bloco, ele aparece aqui em ordem cronológica, com o horário, o tempo gasto e o checklist.";
          summary.textContent = "Nenhum registro";
          dayTotal.textContent = "0 min registrados hoje";
          clearDayButton.style.display = "none";
          exportPdfButton.disabled = true;
          return;
        }

        emptyState.style.display = "none";
        clearDayButton.style.display = "inline-block";
        exportPdfButton.disabled = busy;

        let total = 0;

        entries.forEach(entry => {
          total += Number(entry.durationMs || 0);

          const item = document.createElement("li");
          item.className = "timeline-item";

          const dot = document.createElement("span");
          dot.className = "timeline-dot";

          const meta = document.createElement("div");
          meta.className = "timeline-meta";

          const time = document.createElement("span");
          time.className = "timeline-clock";
          time.textContent =
            `${formatClock(entry.startedAt)} - ${formatClock(entry.endedAt)}`;

          const duration = document.createElement("span");
          duration.className = "timeline-duration";
          duration.textContent = formatDuration(entry.durationMs);

          meta.append(time, duration);

          const titleRow = document.createElement("div");
          titleRow.className = "timeline-title-row";

          const title = document.createElement("div");
          title.className = "timeline-title";
          title.textContent = entry.title;

          const menuButton = document.createElement("button");
          menuButton.type = "button";
          menuButton.className = "entry-menu";
          menuButton.textContent = "···";
          menuButton.title = "Editar registro";
          menuButton.setAttribute("aria-label", "Editar registro");
          menuButton.setAttribute("aria-expanded", "false");

          titleRow.append(title, menuButton);
          item.append(dot, meta, titleRow);

          if (entry.subtasks?.length) {
            const list = document.createElement("ul");
            list.className = "timeline-subtasks";

            entry.subtasks.forEach(subtask => {
              const row = document.createElement("li");
              row.className =
                `timeline-subtask${subtask.done ? " done" : ""}`;

              const mark = document.createElement("span");
              mark.textContent = subtask.done ? "✓" : "○";

              const text = document.createElement("span");
              text.className = "timeline-subtask-text";
              text.textContent = subtask.text;

              row.append(mark, text);
              list.appendChild(row);
            });

            item.appendChild(list);
          }

          const notes = String(entry.notes || "").trim();

          if (notes) {
            const toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "notes-toggle";
            toggle.textContent = "Anotações";
            toggle.setAttribute("aria-expanded", "false");

            const notesBox = document.createElement("div");
            notesBox.className = "timeline-notes";
            notesBox.textContent = notes;

            toggle.addEventListener("click", () => {
              const open = notesBox.classList.toggle("visible");

              toggle.textContent =
                open
                  ? "Fechar anotações"
                  : "Anotações";

              toggle.setAttribute("aria-expanded", String(open));
            });

            item.append(toggle, notesBox);
          }

          const editor = makeEntryEditor(entry, item, menuButton);

          menuButton.addEventListener("click", () => {
            const open = editor.classList.toggle("visible");
            menuButton.setAttribute("aria-expanded", String(open));

            if (open) {
              const input = editor.querySelector(".inline-input");
              if (input) input.focus();
            }
          });

          item.appendChild(editor);
          timeline.appendChild(item);
        });

        summary.textContent =
          `${entries.length} ${entries.length === 1 ? "registro" : "registros"} · ` +
          formatTotal(total);

        dayTotal.textContent =
          `${formatTotal(total)} registrados hoje`;
      }

      function renderAll() {
        renderControls();
        renderActive();
        renderTimeline();
      }

      async function load() {
        setStatus("");

        try {
          const data = await api(
            `/api/state?day=${encodeURIComponent(viewDayKey())}`
          );

          active = data.active || null;
          entries = data.entries || [];
          plans = data.plans || [];
          lastSavedNotes = active?.notes || "";

          renderAll();
        } catch (error) {
          setStatus(
            "Não consegui acessar o banco de dados. Verifique a conexão do PostgreSQL no Railway."
          );

          console.error(error);
        }
      }

      async function saveSubtasks(next) {
        if (!active || busy) {
          return;
        }

        setBusy(true);

        try {
          const data = await api("/api/subtasks", {
            method: "PUT",
            body: JSON.stringify({
              subtasks: next
            })
          });

          active = data.active;
          renderActive();
        } catch (error) {
          setStatus(error.message);
        } finally {
          setBusy(false);
        }
      }

      async function persistNotes(text) {
        if (!active) {
          return;
        }

        notesSaveState.textContent = "Salvando...";

        const promise = api("/api/notes", {
          method: "PUT",
          body: JSON.stringify({
            notes: text
          })
        });

        notesSavePromise = promise;

        try {
          const data = await promise;

          if (notesSavePromise === promise) {
            active = data.active;
            lastSavedNotes = data.active.notes || "";
            notesSaveState.textContent = "Anotações salvas";
          }
        } catch (error) {
          notesSaveState.textContent = "Não foi possível salvar";
          setStatus(error.message);
          throw error;
        } finally {
          if (notesSavePromise === promise) {
            notesSavePromise = null;
          }
        }
      }

      function scheduleNotesSave() {
        if (!active) {
          return;
        }

        active.notes = activeNotes.value;

        if (notesSaveTimer) {
          clearTimeout(notesSaveTimer);
        }

        notesSaveState.textContent = "Salvamento automático...";

        notesSaveTimer = setTimeout(() => {
          notesSaveTimer = null;

          if (active && active.notes !== lastSavedNotes) {
            persistNotes(active.notes).catch(() => {});
          }
        }, 700);
      }

      async function flushNotes() {
        if (!active) {
          return;
        }

        if (notesSaveTimer) {
          clearTimeout(notesSaveTimer);
          notesSaveTimer = null;
        }

        const current = activeNotes.value;
        active.notes = current;

        if (current !== lastSavedNotes) {
          await persistNotes(current);
        } else if (notesSavePromise) {
          await notesSavePromise;
        }
      }

      dateLabel.textContent =
        new Intl.DateTimeFormat("pt-BR", {
          weekday: "long",
          day: "2-digit",
          month: "long"
        })
          .format(new Date())
          .replace(/^./, letter => letter.toUpperCase());

      activityForm.addEventListener("submit", async event => {
        event.preventDefault();

        const title = activityDescription.value.trim();
        const notes = activityNotes.value;

        if (!title) {
          activityMessage.textContent =
            "Escreva a descrição da atividade.";

          activityDescription.focus();
          return;
        }

        activityMessage.textContent = "";
        setStatus("");
        setBusy(true);

        try {
          const data = await api("/api/start", {
            method: "POST",
            body: JSON.stringify({
              title,
              notes
            })
          });

          active = data.active;
          lastSavedNotes = active.notes || "";

          renderAll();
          subtaskInput.focus();
        } catch (error) {
          setStatus(error.message);
        } finally {
          setBusy(false);
        }
      });

      pauseButton.addEventListener("click", async () => {
        if (!active || busy) {
          return;
        }

        setStatus("");
        setBusy(true);

        try {
          await flushNotes();

          const path =
            active.status === "paused"
              ? "/api/resume"
              : "/api/pause";

          const data = await api(path, {
            method: "POST"
          });

          active = data.active;
          lastSavedNotes = active.notes || "";

          renderAll();
        } catch (error) {
          setStatus(error.message);
        } finally {
          setBusy(false);
        }
      });

      finishButton.addEventListener("click", async () => {
        if (!active || busy) {
          return;
        }

        setStatus("");
        setBusy(true);

        try {
          await flushNotes();

          await api("/api/finish", {
            method: "POST"
          });

          active = null;
          lastSavedNotes = "";

          await load();
          activityDescription.focus();
        } catch (error) {
          setStatus(error.message);
        } finally {
          setBusy(false);
        }
      });

      activeNotes.addEventListener("input", scheduleNotesSave);

      activeNotes.addEventListener("blur", () => {
        if (!active) {
          return;
        }

        flushNotes().catch(() => {});
      });

      subtaskForm.addEventListener("submit", async event => {
        event.preventDefault();

        if (!active || busy) {
          return;
        }

        const text = subtaskInput.value.trim();

        if (!text) {
          subtaskMessage.textContent =
            "Digite uma subatividade.";

          return;
        }

        subtaskMessage.textContent = "";

        const id =
          window.crypto && crypto.randomUUID
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random()}`;

        const next = [
          ...(active.subtasks || []),
          {
            id,
            text,
            done: false
          }
        ];

        subtaskInput.value = "";

        await saveSubtasks(next);
        subtaskInput.focus();
      });

      function closeInlineForms() {
        manualForm.classList.remove("visible");
        planForm.classList.remove("visible");
        manualToggleButton.setAttribute("aria-expanded", "false");
        manualError.textContent = "";
        planError.textContent = "";
      }

      function closeManualForm() {
        closeInlineForms();
      }

      manualToggleButton.addEventListener("click", () => {
        const target = viewOffset === 1
          ? planForm
          : manualForm;

        const other = viewOffset === 1
          ? manualForm
          : planForm;

        other.classList.remove("visible");

        const open = target.classList.toggle("visible");
        manualToggleButton.setAttribute("aria-expanded", String(open));

        if (open) {
          if (viewOffset === 1) {
            planError.textContent = "";
            planTitle.focus();
          } else {
            manualError.textContent = "";
            manualTitle.focus();
          }
        }
      });

      manualCancelButton.addEventListener("click", () => {
        closeManualForm();
      });

      manualForm.addEventListener("submit", async event => {
        event.preventDefault();

        const title = manualTitle.value.trim();
        const startTime = manualStart.value;
        const endTime = manualEnd.value;

        if (!title || !startTime || !endTime) {
          manualError.textContent =
            "Preencha descrição, início e fim.";
          return;
        }

        manualError.textContent = "";
        setBusy(true);

        try {
          await api("/api/manual", {
            method: "POST",
            body: JSON.stringify({
              title,
              notes: manualNotes.value,
              day: dayKey(),
              startTime,
              endTime
            })
          });

          manualTitle.value = "";
          manualStart.value = "";
          manualEnd.value = "";
          manualNotes.value = "";
          closeManualForm();

          await load();
        } catch (error) {
          manualError.textContent = error.message;
        } finally {
          setBusy(false);
        }
      });

      planCancelButton.addEventListener("click", () => {
        closeInlineForms();
      });

      planForm.addEventListener("submit", async event => {
        event.preventDefault();

        const title = planTitle.value.trim();

        if (!title) {
          planError.textContent = "Informe a atividade.";
          return;
        }

        planError.textContent = "";
        setBusy(true);

        try {
          await api("/api/plans", {
            method: "POST",
            body: JSON.stringify({
              title,
              notes: planNotes.value,
              day: viewDayKey()
            })
          });

          planTitle.value = "";
          planNotes.value = "";
          closeInlineForms();

          await load();
        } catch (errorValue) {
          planError.textContent = errorValue.message;
        } finally {
          setBusy(false);
        }
      });

      prevDayButton.addEventListener("click", async () => {
        viewOffset = 0;
        closeInlineForms();
        await load();
      });

      nextDayButton.addEventListener("click", async () => {
        viewOffset = 1;
        closeInlineForms();
        await load();
      });

      exportPdfButton.addEventListener("click", () => {
        if (!entries.length) {
          return;
        }

        window.location.href =
          `/api/export/day.pdf?day=${encodeURIComponent(dayKey())}`;
      });

      clearDayButton.addEventListener("click", async () => {
        if (viewOffset !== 0 || !entries.length || busy) {
          return;
        }

        const confirmed = window.confirm(
          "Apagar todos os registros de hoje? Essa ação não pode ser desfeita."
        );

        if (!confirmed) {
          return;
        }

        setBusy(true);

        try {
          await api(
            `/api/day?day=${encodeURIComponent(dayKey())}`,
            {
              method: "DELETE"
            }
          );

          entries = [];
          renderTimeline();
        } catch (error) {
          setStatus(error.message);
        } finally {
          setBusy(false);
        }
      });

      load();
    })();
  </script>
</body>
</html>
