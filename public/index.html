<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5f2">
  <title>Linha do Dia</title>
  <style>
    :root {
      --bg:#f6f5f2; --surface:#fff; --surface-soft:#efeeea; --text:#232321;
      --muted:#777570; --border:#dedcd6; --border-strong:#c9c6bf;
      --button:#292927; --button-text:#fff; --danger:#9f4d4d;
    }
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit} button{cursor:pointer} button:disabled{cursor:default;opacity:.42}
    .page{width:min(1180px,calc(100% - 44px));margin:0 auto;padding:42px 0 80px}
    .topbar{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:42px}
    .date{margin-bottom:7px;color:var(--muted);font-size:14px}
    h1{margin:0;font-size:clamp(26px,4vw,34px);font-weight:650;letter-spacing:-.04em}
    .day-total{color:var(--muted);font-size:14px;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
    .focus-panel,.timeline-panel{min-width:0}
    .timeline-panel{border-left:1px solid var(--border);padding-left:42px}
    .timer{margin:0 0 34px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:clamp(48px,7vw,78px);font-weight:520;line-height:1;letter-spacing:-.065em;font-variant-numeric:tabular-nums}
    .field-label,.section-label{display:block;margin-bottom:9px;font-size:14px;font-weight:650}
    textarea,.subtask-input{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
    textarea:focus,.subtask-input:focus{border-color:var(--border-strong);box-shadow:0 0 0 3px rgba(35,35,33,.06)}
    textarea{min-height:112px;resize:vertical;border-radius:14px;padding:15px 16px;font-size:16px;line-height:1.55}
    textarea:disabled{background:var(--surface-soft);color:var(--muted)}
    .helper{min-height:22px;padding-top:5px;color:var(--muted);font-size:13px}
    .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
    .button{min-height:44px;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);padding:0 17px;font-weight:620}
    .button-primary{border-color:var(--button);background:var(--button);color:var(--button-text)}
    .button-subtle{background:transparent}
    .active-card{display:none;margin-top:30px;padding-top:24px;border-top:1px solid var(--border)}
    .active-card.visible{display:block}
    .eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
    .active-title{margin-top:6px;font-size:19px;font-weight:650;line-height:1.45;overflow-wrap:anywhere}
    .active-time{margin-top:6px;color:var(--muted);font-size:13px}
    .subtasks{margin-top:28px}
    .subtasks-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:11px}
    .subtasks-head .section-label{margin:0}.progress{color:var(--muted);font-size:12px}
    .subtask-form{display:flex;gap:8px}
    .subtask-input{min-width:0;flex:1;border-radius:11px;padding:11px 12px;font-size:16px}
    .subtask-list,.timeline,.timeline-subtasks{list-style:none;margin:0;padding:0}
    .subtask-list{margin-top:8px}
    .subtask-row{display:grid;grid-template-columns:22px minmax(0,1fr) 34px;gap:8px;align-items:start;padding:8px 0}
    .subtask-row input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--button)}
    .subtask-text{min-width:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .subtask-row.done .subtask-text{color:var(--muted);text-decoration:line-through}
    .remove-subtask{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;line-height:1}
    .timeline-header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}
    .timeline-header h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em}
    .summary{color:var(--muted);font-size:13px}
    .empty{padding:26px 0;border-top:1px solid var(--border);color:var(--muted);font-size:14px;line-height:1.65}
    .timeline{position:relative;padding-left:26px}.timeline:before{content:"";position:absolute;top:7px;bottom:0;left:4px;width:1px;background:var(--border)}
    .timeline-item{position:relative;padding:0 0 34px}.timeline-dot{position:absolute;top:6px;left:-26px;width:9px;height:9px;border-radius:50%;background:var(--text)}
    .timeline-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px 12px}
    .timeline-clock{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;font-variant-numeric:tabular-nums}
    .timeline-duration{color:var(--muted);font-size:12px}.timeline-title{margin-top:7px;font-size:16px;font-weight:650;line-height:1.5;overflow-wrap:anywhere}
    .timeline-subtasks{margin-top:12px}.timeline-subtask{display:grid;grid-template-columns:18px minmax(0,1fr);gap:7px;margin-bottom:6px;color:var(--text);font-size:13px;line-height:1.5}
    .timeline-subtask.done{color:var(--muted)}.timeline-subtask.done .timeline-subtask-text{text-decoration:line-through}
    .footer-actions{display:flex;justify-content:flex-end;margin-top:10px}.clear-day{border:0;background:transparent;color:var(--muted);padding:8px 0;font-size:12px}.clear-day:hover{color:var(--danger)}
    .status{margin-bottom:18px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px;display:none}
    .status.visible{display:block}
    @media(max-width:820px){.page{width:min(100% - 28px,660px);padding-top:28px}.topbar{align-items:start;flex-direction:column;margin-bottom:34px}.layout{grid-template-columns:1fr;gap:48px}.timeline-panel{border-top:1px solid var(--border);border-left:0;padding-top:32px;padding-left:0}.timer{letter-spacing:-.055em}}
    @media(max-width:480px){.page{width:calc(100% - 22px)}.subtask-form{flex-direction:column}.subtask-form .button{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .button-primary{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div><div class="date" id="dateLabel"></div><h1>Linha do Dia</h1></div>
      <div class="day-total" id="dayTotal">Carregando…</div>
    </header>

    <div class="status" id="statusMessage" aria-live="polite"></div>

    <div class="layout">
      <section class="focus-panel" aria-label="Cronômetro">
        <div class="timer" id="timer" aria-live="polite">00:00:00</div>

        <form id="activityForm">
          <label class="field-label" for="activity">O que você está fazendo?</label>
          <textarea id="activity" maxlength="500" placeholder="Ex.: Revisando a petição inicial"></textarea>
          <div class="helper" id="activityMessage" aria-live="polite"></div>
          <div class="actions">
            <button class="button button-primary" id="startButton" type="submit">Iniciar</button>
            <button class="button" id="pauseButton" type="button" disabled>Pausar</button>
            <button class="button" id="finishButton" type="button" disabled>Concluir</button>
          </div>
        </form>

        <section class="active-card" id="activeCard">
          <div class="eyebrow">Em andamento</div>
          <div class="active-title" id="activeTitle"></div>
          <div class="active-time" id="activeTime"></div>

          <div class="subtasks">
            <div class="subtasks-head">
              <span class="section-label">Subatividades</span>
              <span class="progress" id="subtaskProgress">0/0</span>
            </div>

            <form class="subtask-form" id="subtaskForm">
              <input class="subtask-input" id="subtaskInput" type="text" maxlength="180" autocomplete="off" placeholder="Adicionar item ao checklist">
              <button class="button button-subtle" type="submit">Adicionar</button>
            </form>

            <div class="helper" id="subtaskMessage" aria-live="polite"></div>
            <ul class="subtask-list" id="subtaskList"></ul>
          </div>
        </section>
      </section>

      <section class="timeline-panel" aria-label="Linha do tempo do dia">
        <div class="timeline-header">
          <h2>Hoje</h2>
          <span class="summary" id="summary">Carregando…</span>
        </div>
        <div class="empty" id="emptyState">Conforme você conclui cada bloco, ele aparece aqui com o horário, o tempo gasto e o checklist.</div>
        <ol class="timeline" id="timeline"></ol>
        <div class="footer-actions">
          <button class="clear-day" id="clearDayButton" type="button">Limpar registros de hoje</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const $ = s => document.querySelector(s);
      const timerEl=$("#timer"), dateLabel=$("#dateLabel"), dayTotal=$("#dayTotal"),
        activityForm=$("#activityForm"), activityInput=$("#activity"),
        activityMessage=$("#activityMessage"), startButton=$("#startButton"),
        pauseButton=$("#pauseButton"), finishButton=$("#finishButton"),
        activeCard=$("#activeCard"), activeTitle=$("#activeTitle"), activeTime=$("#activeTime"),
        subtaskForm=$("#subtaskForm"), subtaskInput=$("#subtaskInput"),
        subtaskMessage=$("#subtaskMessage"), subtaskProgress=$("#subtaskProgress"),
        subtaskList=$("#subtaskList"), summary=$("#summary"), emptyState=$("#emptyState"),
        timeline=$("#timeline"), clearDayButton=$("#clearDayButton"), statusMessage=$("#statusMessage");

      let active=null, entries=[], timerInterval=null, busy=false;

      const dayKey=()=>{
        const d=new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      };
      const clock=d=>new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(new Date(d));
      const timerText=ms=>{
        const total=Math.max(0,Math.floor(ms/1000));
        const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
        return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
      };
      const durationText=ms=>{
        const sec=Math.max(1,Math.floor(ms/1000)),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);
        if(h)return `${h}h ${String(m).padStart(2,"0")}min`;
        if(m)return `${m} min`;
        return `${sec} s`;
      };
      const totalText=ms=>{
        const mins=Math.floor(ms/60000);
        if(mins<60)return `${mins} min`;
        const h=Math.floor(mins/60),m=mins%60;
        return m?`${h}h ${m}min`:`${h}h`;
      };
      const elapsed=()=>{
        if(!active)return 0;
        let value=Number(active.accumulatedMs||0);
        if(active.status==="active"&&active.lastStartedAt){
          value+=Math.max(0,Date.now()-new Date(active.lastStartedAt).getTime());
        }
        return value;
      };
      const setStatus=(message="")=>{
        statusMessage.textContent=message;
        statusMessage.classList.toggle("visible",Boolean(message));
      };
      async function api(path, options={}){
        const response=await fetch(path,{
          headers:{"Content-Type":"application/json",...(options.headers||{})},
          ...options
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error||"Não foi possível concluir a operação.");
        return data;
      }
      function setBusy(value){
        busy=value;
        renderControls();
      }
      function renderTimer(){timerEl.textContent=timerText(elapsed())}
      function startTick(){
        if(timerInterval)clearInterval(timerInterval);
        timerInterval=setInterval(renderTimer,250);
        renderTimer();
      }
      function stopTick(){
        if(timerInterval)clearInterval(timerInterval);
        timerInterval=null;
      }
      function renderControls(){
        const running=Boolean(active);
        activityInput.disabled=running||busy;
        startButton.disabled=running||busy;
        pauseButton.disabled=!running||busy;
        finishButton.disabled=!running||busy;
        pauseButton.textContent=active?.status==="paused"?"Continuar":"Pausar";
      }
      function renderActive(){
        if(!active){
          activeCard.classList.remove("visible");
          activityInput.value="";
          renderSubtasks();
          stopTick();
          renderTimer();
          return;
        }
        activeCard.classList.add("visible");
        activityInput.value=active.title;
        activeTitle.textContent=active.title;
        activeTime.textContent=`Iniciado às ${clock(active.startedAt)}${active.status==="paused"?" · pausado":""}`;
        renderSubtasks();
        if(active.status==="active")startTick(); else {stopTick();renderTimer();}
      }
      function renderSubtasks(){
        subtaskList.innerHTML="";
        const subtasks=active?.subtasks||[];
        const done=subtasks.filter(x=>x.done).length;
        subtaskProgress.textContent=`${done}/${subtasks.length}`;

        subtasks.forEach(item=>{
          const row=document.createElement("li");
          row.className=`subtask-row${item.done?" done":""}`;
          const cb=document.createElement("input");
          cb.type="checkbox"; cb.checked=item.done;
          cb.addEventListener("change",async()=>{
            const next=subtasks.map(x=>x.id===item.id?{...x,done:cb.checked}:x);
            await saveSubtasks(next);
          });
          const text=document.createElement("span");
          text.className="subtask-text"; text.textContent=item.text;
          const remove=document.createElement("button");
          remove.type="button"; remove.className="remove-subtask"; remove.textContent="×"; remove.title="Remover";
          remove.addEventListener("click",async()=>{
            await saveSubtasks(subtasks.filter(x=>x.id!==item.id));
          });
          row.append(cb,text,remove);
          subtaskList.appendChild(row);
        });
      }
      function renderTimeline(){
        timeline.innerHTML="";
        if(!entries.length){
          emptyState.style.display="block";
          summary.textContent="Nenhum registro";
          dayTotal.textContent="0 min registrados hoje";
          clearDayButton.style.display="none";
          return;
        }
        emptyState.style.display="none";
        clearDayButton.style.display="inline-block";
        let total=0;
        entries.forEach(entry=>{
          total+=Number(entry.durationMs||0);
          const item=document.createElement("li"); item.className="timeline-item";
          const dot=document.createElement("span"); dot.className="timeline-dot";
          const meta=document.createElement("div"); meta.className="timeline-meta";
          const time=document.createElement("span"); time.className="timeline-clock"; time.textContent=`${clock(entry.startedAt)} – ${clock(entry.endedAt)}`;
          const dur=document.createElement("span"); dur.className="timeline-duration"; dur.textContent=durationText(entry.durationMs);
          meta.append(time,dur);
          const title=document.createElement("div"); title.className="timeline-title"; title.textContent=entry.title;
          item.append(dot,meta,title);
          if(entry.subtasks?.length){
            const list=document.createElement("ul"); list.className="timeline-subtasks";
            entry.subtasks.forEach(sub=>{
              const row=document.createElement("li"); row.className=`timeline-subtask${sub.done?" done":""}`;
              const mark=document.createElement("span"); mark.textContent=sub.done?"✓":"○";
              const text=document.createElement("span"); text.className="timeline-subtask-text"; text.textContent=sub.text;
              row.append(mark,text); list.appendChild(row);
            });
            item.appendChild(list);
          }
          timeline.appendChild(item);
        });
        summary.textContent=`${entries.length} ${entries.length===1?"registro":"registros"} · ${totalText(total)}`;
        dayTotal.textContent=`${totalText(total)} registrados hoje`;
      }
      function renderAll(){renderControls();renderActive();renderTimeline()}
      async function load(){
        setStatus("");
        try{
          const data=await api(`/api/state?day=${encodeURIComponent(dayKey())}`);
          active=data.active||null; entries=data.entries||[];
          renderAll();
        }catch(error){
          setStatus("Não consegui acessar o banco de dados. Verifique a conexão do PostgreSQL no Railway.");
          console.error(error);
        }
      }
      async function saveSubtasks(next){
        if(!active||busy)return;
        setBusy(true);
        try{
          const data=await api("/api/subtasks",{method:"PUT",body:JSON.stringify({subtasks:next})});
          active=data.active; renderActive();
        }catch(error){setStatus(error.message)}
        finally{setBusy(false)}
      }

      dateLabel.textContent=new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"2-digit",month:"long"}).format(new Date()).replace(/^./,c=>c.toUpperCase());

      activityForm.addEventListener("submit",async e=>{
        e.preventDefault();
        const title=activityInput.value.trim();
        if(!title){activityMessage.textContent="Escreva o que você está fazendo.";activityInput.focus();return}
        activityMessage.textContent="";setStatus("");setBusy(true);
        try{
          const data=await api("/api/start",{method:"POST",body:JSON.stringify({title})});
          active=data.active; renderAll(); subtaskInput.focus();
        }catch(error){setStatus(error.message)}
        finally{setBusy(false)}
      });

      pauseButton.addEventListener("click",async()=>{
        if(!active||busy)return;
        setStatus("");setBusy(true);
        try{
          const path=active.status==="paused"?"/api/resume":"/api/pause";
          const data=await api(path,{method:"POST"});
          active=data.active; renderAll();
        }catch(error){setStatus(error.message)}
        finally{setBusy(false)}
      });

      finishButton.addEventListener("click",async()=>{
        if(!active||busy)return;
        setStatus("");setBusy(true);
        try{
          await api("/api/finish",{method:"POST"});
          active=null;
          await load();
          activityInput.focus();
        }catch(error){setStatus(error.message)}
        finally{setBusy(false)}
      });

      subtaskForm.addEventListener("submit",async e=>{
        e.preventDefault();
        if(!active||busy)return;
        const text=subtaskInput.value.trim();
        if(!text){subtaskMessage.textContent="Digite uma subatividade.";return}
        subtaskMessage.textContent="";
        const next=[...(active.subtasks||[]),{id:(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`),text,done:false}];
        subtaskInput.value="";
        await saveSubtasks(next);
        subtaskInput.focus();
      });

      clearDayButton.addEventListener("click",async()=>{
        if(!entries.length||busy)return;
        if(!confirm("Apagar todos os registros de hoje? Essa ação não pode ser desfeita."))return;
        setBusy(true);
        try{
          await api(`/api/day?day=${encodeURIComponent(dayKey())}`,{method:"DELETE"});
          entries=[];renderTimeline();
        }catch(error){setStatus(error.message)}
        finally{setBusy(false)}
      });

      load();
    })();
  </script>
</body>
</html>
